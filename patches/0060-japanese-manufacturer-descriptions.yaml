attribution: flipcommons-ai-desc-manufacturer
description: >
  Narrative descriptions for Japanese manufacturers.
claims:
  - manufacturer.nihon-tenbo:
      expect: { name: Nihon Tenbo }
      description: |
        Nihon Tenbo (日本展望娯楽社, "Japan Outlook Entertainment Company," abbreviated Nitten) was a Japanese manufacturer of [[technology-generation:electromechanical]] pinball machines. From the late 1960s into the early 1970s it built sports-themed tables — [[model:home-run-nihon-tenbo]] (c.1967), [[model:soccer-ace]] (1969), and [[model:beat-spark]] and [[model:jumbokick]] (both 1970) — and worked with [[manufacturer:nihon-goraku-ki-kabushikigaisha]] on the [[franchise:ultraman]]-based [[model:ultra-attack]] and [[model:ultra-spark]].[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1967 Home Run - ホームランゲーム by 日本展望娯楽社 (Nihon Tenbo Entertainment Company) [...] 1969 Socker Ace - サッカーエース (Soccer Ace) by 日本展望娯楽社 (Nihon Tenbo Entertainment Company — Nitten) [...] yokomono ~ flipper pinball [...] 1970 ビート & スパーク (Beat & Spark) [Socker] by 東急商事株式會社 (Tokyo Corporation) & 日本展望娯楽社 (Nihon Tenbo) [...] 1970 ジャンボ キック (Jumbo Kick) by 東急商事株式會社 (Tokyo Corporation) & 日本展望娯楽社 (Nihon Tenbo) [...] ~1972 ウルトラアタック (Ultra Attack) by 日本娯楽機 (Nihon Gorakuki) & 日本展望娯楽社 (Nihon Tenbo) [presumed] [...] theme ~ kaiju & mecha [...] theme ~ licensed property [...] ~1972 ウルトラスパーク (Ultra Spark) by 日本娯楽機 (Nihon Gorakuki) & 日本展望娯楽社 (Nihon Tenbo) [presumed]"
  - manufacturer.kato:
      expect: { name: Kato }
      description: |
        Kato (カトウ) was a Japanese manufacturer of [[technology-generation:electromechanical]] games, remembered for the soccer game [[model:soccer-8]] (c.1967).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1967 サッカー8 [エイト] (Soccer 8) by カトウ (Kato) [...] theme ~ sports ~ football (soccer)"
  - manufacturer.showa-yuen:
      expect: { name: Showa Yuen }
      description: |
        Showa Yuen (昭和遊園) was a Japanese amusement-game manufacturer, behind the space-themed pinball machine [[model:rocket-v]] (1970).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1970 Rocket V - ロケットV by 昭和遊園 (Showa Yuen) [...] theme ~ space/UFOs/scifi [...] yokomono ~ flipper pinball"
  - manufacturer.childrens-amusement-park-facilities:
      expect: { name: "Children's Amusement Park Facilities" }
      description: |
        Children's Amusement Park Facilities (児童遊園設備) was a Japanese manufacturer of [[technology-generation:electromechanical]] games, behind the space-themed [[model:space-patrol-childrens]] (c.1968).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1968 宇宙パトロール (space patrol) [presumed] by 児童遊園設備 (Children's Amusement Park Facilities) [presumed] [...] theme ~ space/UFOs/scifi"
  - manufacturer.banpresto:
      expect: { name: Banpresto }
      description: |
        Banpresto (バンプレスト) is a Japanese amusement and toy manufacturer. Founded in 1977, it became a Bandai subsidiary in 1989, and its video-game and amusement business was absorbed into [[manufacturer:bandai-namco]] in 2008. From its [[location:japan/tokyo/shinagawa]] base it made two prize-redemption machines: [[model:muden-kun]] (1999) and the licensed [[model:kinnikuman-ii-power-mucho]] (2002).[[cite:1]]
      cites:
        "1":
          ref: https://en.wikipedia.org/wiki/Banpresto
          quote: "Banpresto Co., Ltd.[c] (formerly Coreland Technology Inc.) was a Japanese video game developer and publisher headquartered in Shinagawa, Tokyo. [...] In addition to video games, Banpresto produced toys, keyrings, apparel, and plastic models. [...] Banpresto was founded by Japanese businessman Yasushi Matsuda as Hoei International on April 30, 1977. [...] Coreland was majority-acquired by Bandai in 1989 following severe financial difficulties and renamed Banpresto, becoming Bandai's arcade game division. [...] It continued producing games until 2008 when it was absorbed by Namco Bandai Games, and its toy and arcade divisions were spun-off into an unrelated company that carried the same name. [...] It also operated amusement facilities across Japan, including Hanayashiki, as well as producing model kits, stuffed toys, and UFO catcher prizes."
  - manufacturer.tomato-land:
      expect: { name: Tomato Land }
      description: |
        Tomato Land (トマトランド) is a diversified manufacturer based in [[location:japan/osaka/higashi-osaka]]. Its amusement division produced the candy-vending "Target Machine" redemption games — [[model:target-machine-base-ball]] (2007), [[model:target-machine-type-1]] (c.2007) and the pirate-themed [[model:target-machine-pirates]] (c.2010).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "2007 Target Machine Base Ball - ターゲットマシン ベースボール by トマトランド (Tomato Land) [...] vending machine ~ candy [...] ~2007 Target Machine Tropical Q - ターゲットマシン タイプ１ (Target machine type 1) by トマトランド (Tomato Land) [...] 2010s ターゲットマシン パイレーツ (Target machine pirates) by トマトランド (Tomato Land) [...] theme ~ pirates [...] vending machine ~ candy"
  - manufacturer.towa:
      expect: { name: Towa }
      description: |
        Towa (トーワ) was a Japanese manufacturer of the head-to-head pinball-like hockey game [[model:slap-shot-towa]] (c.1996, with a 1997 version).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1996 Slap Shot - スラップショット by トーワ (Towa) [...] theme ~ sports ~ hockey [...] yokomono ~ flipper pinball [...] 1997 Slap Shot - スラップショット by トーワ (Towa)"
  - manufacturer.sunwise:
      expect: { name: Sunwise }
      description: |
        Sunwise (サンワイズ) was a Japanese amusement-game manufacturer based in [[location:japan/tokyo/mitaka]]. It made [[model:american-battle-dome]] (1995), adapting Tsukuda Original's [[franchise:battle-dome]] toy.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1995 American Battle Dome - アメリカンバトルゲーム by サンワイズ (Sunwise) & Tsukuda Original"
