  - model.yukon-yeti:
      note: "Announced after the March reveal - the reveal-era press coverage predates this and names no dedicated sound designer, and the page's formal Credits block, which lists no audio roles at all, predates the announcement too; the maker's own announcement is the newest statement and wins on chronology."
      cite:
        ref: "https://turnerpinball.com/games/yukon-yeti"
        locator: in the audio-team announcement section
        quote: "Chris Granner is joining Yukon Yeti™ to lead its sound direction"
      credit:
        - chris-granner: sound
  - model.yukon-yeti:
      cite:
        ref: "https://turnerpinball.com/games/yukon-yeti"
        locator: in the audio-team announcement section
        quote: Adam Gubman joins the project as composer and sound designer.
      credit:
        - adam-gubman: music
        - adam-gubman: sound
  - model.yukon-yeti:
      note: "Two ball locks: the five-ball stair-step Avalanche lock and the hidden Yeti lock, so ball-locks carries no count; both feed multiballs (Avalanche Multiball on the maker page, the hidden lock's secondary multiball per Kineticist)."
      cite:
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Playfield Overview section
          quote: A signature stair-step lock mech that can hold up to five balls and unleash them for Avalanche Multiball.
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Playfield Overview section
          quote: A hidden lock that adds surprise and depth to the playfield progression.
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: "Behind the upper-right flipper, two optos and a post create a concealed ball lock that can hold two balls for a secondary multiball."
      gameplay_feature: [ball-locks, multiball]
  - model.yukon-yeti:
      note: "Ramps carry no count: the wavy Rapids ramp, the mine cart ramp and the Avalanche ramp leave any single total unstated."
      cite:
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Playfield Overview section
          quote: A nostalgic and playful wavy ramp that adds strong visual identity and memorable shot value.
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Playfield Overview section
          quote: "The upper playfield opens access to multiple routes, including the rapids and mine cart ramps."
      gameplay_feature: [ramps, mini-playfields]
  - model.yukon-yeti:
      cite:
        ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
        quote: "The game runs four flippers total, including a mid-playfield flipper that wasn't part of the original White Water layout."
      gameplay_feature: [{ flippers: 4 }]
  - model.yukon-yeti:
      note: "The Yeti sculpt is the playfield centerpiece and does not move (the moving Yeti lives in the optional topper), so it classifies as a static toy."
      cite:
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Playfield Overview section
          quote: A major playfield centerpiece featuring the Yukon Yeti himself.
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: the Yeti sculpt on the upper playfield doesn't move
      gameplay_feature: [static-toys]
  - model.yukon-yeti:
      note: "Hardware named by Kineticist's rules walkthrough where the maker's own page stays at mode level; the target bank's type is not stated, so the generic targets feature attaches."
      cite:
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: Shoot Kate's Place spinner to light the Dawson shot for mode start.
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: The Glacier (Newton ball) and drop target also award nuggets when lit
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: "this sends the ball to the pop bumpers, which award nuggets per hit"
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: Completing the target bank cycles through three rewards in order
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: "On the upper playfield, a trapdoor near the Yeti serves two functions."
      gameplay_feature:
        [spinners, newton-balls, drop-targets, pop-bumpers, targets, trap-doors]
  - model.yukon-yeti:
      cite:
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Ordering Options base-game list
          quote: Removable glass frame with standard-size tempered glass
        - ref: "https://www.pinballnews.com/site/2026/03/18/yukon-yeti-revealed"
          quote: The cabinet includes secondary flipper buttons on both sides which operate the Finesse Flip function to perform a tap pass which transfers the ball from one main flipper to the other.
      gameplay_feature: [removable-glass-frames, finesse-flip]
  - model.merlins-arcade-legendary-edition:
      note: "The maker sells the title as one core game in two trims, the Arcade Edition cheaper and unlimited, the Legendary numbered and capped at 500 - so the Arcade Edition is the base and the Legendary Edition its variant (the cheaper, less-limited edition is the base), the same shape Ninja Eclipse's editions already have."
      cite:
        - ref: "https://turnerpinball.com/games/merlins-arcade"
          locator: in the Editions section
          quote: "Both editions deliver the same core game. Differences are in toys, trim, presentation, and premium features."
        - ref: "https://turnerpinball.com/games/merlins-arcade"
          locator: in the Reservation terms & FAQ section
          quote: "No more than 500 Legendary Edition™ Merlin's Arcade™ machines will be produced. Each will be numbered and include a signed Certificate of Authenticity. Arcade Edition™ machines are not numbered or limited."
      variant_of: merlins-arcade-arcade-edition
  - model.merlins-arcade-legendary-edition:
      cite:
        - ref: "https://turnerpinball.com/games/merlins-arcade"
          quote: "Legendary Edition™ is available now. Arcade Edition™ is sold out."
        - ref: "https://turnerpinball.com/about"
          locator: in the Our Journey timeline
          quote: "The first customer units for Merlin's Arcade™ started going out in late summer."
      production_status: produced
  - model.merlins-arcade-arcade-edition:
      note: "Sold through and out of production - the edition shipped."
      cite:
