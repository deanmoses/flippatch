        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the page footer
          quote: "© 2026 Turner Logic, LLC. All rights reserved."
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: Turner recently purchased approximately 17 acres near his current location in the San Antonio area
      location: [usa/tx/boerne]
  - model.yukon-yeti:
      note: "The maker sells the machine as Yukon Yeti Legendary Edition - the Legendary Edition is the base game itself, its only edition, and the All-In Package is an upgrades bundle, not an edition - so the model takes the maker's edition name, matching the naming of Merlin's Arcade (Legendary Edition)."
      cite:
        - ref: "https://turnerpinball.com/games/yukon-yeti"
          locator: in the Ordering Options section
          quote: "Yukon Yeti™ Legendary Edition includes the core game with premium construction and hand-crafted detail."
        - ref: "https://www.kineticist.com/news/turner-reveals-yukon-yeti"
          quote: "Turner is shipping one edition rather than splitting into Pro/Premium/LE tiers — the Legendary Edition at $9,999, capped at 500 units"
      name: Yukon Yeti (Legendary Edition)
  - model.yukon-yeti:
      note: "First shipments are still expected, so the machine is announced."
      cite:
        ref: "https://turnerpinball.com/games/yukon-yeti"
        locator: in the FAQ section
        quote: "Yukon Yeti™ is currently expected to begin shipping in Summer 2026."
      production_status: announced
