      production_status: produced
  - model.merlins-arcade-legendary-edition:
      note: "500 is the maker's announced production cap ('no more than'), matching Pinball News's 'limited run of up to 500 units'; the numbered, certificated run takes the limited-edition tag."
      cite:
        - ref: "https://turnerpinball.com/games/merlins-arcade"
          locator: in the Reservation terms & FAQ section
          quote: "No more than 500 Legendary Edition™ Merlin's Arcade™ machines will be produced. Each will be numbered and include a signed Certificate of Authenticity. Arcade Edition™ machines are not numbered or limited."
        - ref: "https://www.pinballnews.com/site/2025/03/19/merlins-arcade-revealed"
          quote: "The Legendary Edition is a limited run of up to 500 units, while the Arcade Edition has no restriction on production."
      production_quantity: 500
      tag: [limited-edition]
