      name: "Turner Logic, LLC"
  - corporate-entity.turner-pinball:
      note: "Turner Pinball's legal name is Turner Logic, LLC - every turnerpinball.com footer carries its copyright - and Turner Logic's own site publishes a Boerne, TX mailing address with the same 210-901-9955 phone number turnerpinball.com's contact page lists, tying the two sites to one company. Kineticist places the manufacturing facility in the San Antonio area, which Boerne is in. The maker's own site states no street address."
      cite:
        - ref: "https://turnerlogic.com/contact"
          locator: in the Mailing Address block
          quote: "215 West Bandera Road Ste. 114-814 Boerne, TX 78006"
        - ref: "https://turnerlogic.com/contact"
          locator: in the Phone block
          quote: "(210) 901-9955"
        - ref: "https://turnerpinball.com/contact"
          locator: in the Call Us block
