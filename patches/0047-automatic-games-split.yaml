attribution: flipcommons-catalog
description: Split the over-merged Automatic Games brand into its two firms.
claims:
  - manufacturer.automatic-games:
      expect: { name: Automatic Games }
      note: 'Correcting the earlier ingest, which name-matched two distinct firms into a single "Automatic Games" brand. IPDB manufacturer 40 (Automatic Games Company, of Inglewood, California; sole product Fifty Grand, 1933) and IPDB manufacturer 41 (Automatic Games Company, of St. Paul, Minnesota; sole product Hi-Lo, 1932) are separate companies -- different states, no shared products. Naming this manufacturer for its Inglewood firm; the St. Paul firm is split to its own manufacturer.'
      name: Automatic Games Company (Inglewood)
  - manufacturer.automatic-games-company-st-paul:
      name: Automatic Games Company (St. Paul)
      create: true
  - corporate-entity.automatic-games-company-st-paul:
      expect: { ipdb_manufacturer_id: 41, manufacturer: automatic-games }
      note: 'Correcting the earlier ingest: the St. Paul firm (IPDB manufacturer 41) was name-matched onto the shared "Automatic Games" brand though it is unrelated to the Inglewood firm (IPDB manufacturer 40). Re-attributed to its own manufacturer.'
      manufacturer: automatic-games-company-st-paul
