attribution: flipcommons-catalog
# Completes conversion-kit tagging for the machines on tilt.it's
# unidentified-Italian-kits section (flipper kit italiani non identificati).
# The generated sweep tagged only rows whose review verdict stated kit
# outright, missing both the hedged creates and the seeded IPDB models the
# page carries explicit "(kit for ...)" statements about. Machines tilt.it
# files in the section without a per-machine statement are tagged on that
# section membership, said so in the note. tilt.it's own hedges (forse,
# "looks like") stay quoted/noted.
description: conversion-kit tags for the tilt.it unidentified-Italian-kits machines.
claims:
  - model.tex-op:
      cite:
        ref: https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati
        quote: "Tex-Op (kit for Gottlieb's Harmony/Troubadour)"
      tag: [conversion-kit]
  - model.bowling:
      cite:
        ref: https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati
        quote: 'Bowling (kit for Gottlieb''s "Harmony"/"Troubadour")'
      tag: [conversion-kit]
