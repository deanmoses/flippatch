attribution: flipcommons-ai-desc-gameplay-feature
description: >
  Narrative descriptions for gameplay features.
claims:
  - gameplay-feature.orbits:
      description: |
        Curved lanes that send the ball in a sweeping loop around the upper playfield, typically hugging the top arch before feeding back to the [[gameplay-feature:flippers]], an inlane, or another shot; a full orbit carries the ball all the way around, while a half orbit diverts it partway across. Often fed through a [[gameplay-feature:spinners]] at the lane mouth, orbits reward smooth, powerful shots and form the backbone of the flowing "fan layout" designs epitomized by [[person:brian-eddy]]'s *[[title:attack-from-mars]]* (1995, [[manufacturer:bally]]) and *[[title:medieval-madness]]* (1997, [[manufacturer:williams]]). Unlike [[gameplay-feature:ramps]], which lift the ball above the playfield, an orbit stays at playfield level and curves around its edge, making it a natural building block for loop combos and continuous flow.
  - gameplay-feature.auto-launch:
      description: |
        A solenoid-driven [[gameplay-feature:kickers]] mechanism in the shooter lane that fires the ball into play at the press of a button, replacing the manual spring [[gameplay-feature:plungers]]. Because the machine itself controls the launch, it can re-serve balls automatically — feeding the shooter lane during [[gameplay-feature:multiball]], relaunching after a [[gameplay-feature:ball-save]], or firing on a timer — and can stage a button-press [[gameplay-feature:skill-shot]] in place of a measured plunge. Auto-launchers spread across the [[display-type:dot-matrix]] era on [[manufacturer:williams]] and [[manufacturer:bally]] machines and are now near-universal on modern [[manufacturer:stern-pinball]] games such as *[[title:godzilla]]* (2021).
