  - model.fish-tales:
      note: "A machine made in five figures was commercially produced."
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "Fish Tales is a perfect example with over 13,000 made"
        - ref: "youtube:1p6cpLBQJwk"
          quote: "they made over 13,000 uh of these machines"
      production_status: produced
  - model.fish-tales:
      note: "The fishing-rod-shaped Autoplunger is an auto-launch; the ball-launching catapult is a catapult; the rotary reel lock is a ball lock."
      cite:
        ref: "ipdb:861"
        quote: "Flippers (2), Criss-cross Ramps (2), Rollunder spinner (1), Multiball, Captive ball, Autoplunger (shaped like a fishing rod), ball-launching catapult next to the rotary reel lock."
      game_format: pinball
      gameplay_feature:
        [{ ramps: 2 }, captive-ball, auto-launch, catapults, ball-locks]
