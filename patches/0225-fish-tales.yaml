claims:
  - manufacturer.fast-pinball:
      create: true
      note: "FAST Pinball makes boardsets, not machines of its own."
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "He writes the code, designs the games, and has brought in more professional artists and voice actors with each title, while FAST Pinball handles the hardware."
        - ref: "youtube:o-XezhzIBvg"
          quote: "this [snorts] company, Fast, is not my company. We we contract out to get these boards from them. They designed them."
      name: FAST Pinball
  - location.usa/wa/gig-harbor:
      create: true
      cite:
        ref: "https://skill-shot.com/venue/fast-pinball-hq/"
        locator: in the venue listing's Address block
        quote: "3226 Harborview Drive, Suite 8 Gig Harbor, WA 98335"
      slug: gig-harbor
      parent: usa/wa
      name: Gig Harbor
  - location.usa/nj/pennsville:
      create: true
      cite:
        ref: "https://www.city-data.com/business-entities/NJ/CARDONA-PINBALL-DESIGNS-LLC-0450585629-NJ.html"
        quote: "CARDONA PINBALL DESIGNS, LLC [...] City: PENNSVILLE"
      slug: pennsville
      parent: usa/nj
      name: Pennsville
  - corporate-entity.cardona-pinball-designs:
      note: "The New Jersey business registry, republished by City-Data, registers the company in Pennsville, in the state's southwest corner; the manufacturer's own sites publish no address."
      cite:
        ref: "https://www.city-data.com/business-entities/NJ/CARDONA-PINBALL-DESIGNS-LLC-0450585629-NJ.html"
        quote: "CARDONA PINBALL DESIGNS, LLC [...] Entity Id: 0450585629 [...] Registration date: 2021 Jan 06 [...] City: PENNSVILLE"
      location: [usa/nj/pennsville]
  - corporate-entity.fast-pinball:
      create: true
      note: "The manufacturer's own site says only 'greater Seattle area'; Skill Shot's venue listing places its headquarters in Gig Harbor, as do the Washington company registry (UBI 603387874) and the manufacturer's own Facebook page header."
      cite:
        - ref: "https://fastpinball.com/about"
          quote: "FAST Pinball was founded in 2014 by Aaron Davis and Dave Beecher. We're based in the greater Seattle area and have sold pinball control systems to customers around the world, including individual hobbyists, indie pinball designers, and to pinball manufacturing companies who build upgrade kits and complete machines."
        - ref: "https://fastpinball.com/about"
          locator: in the site footer's copyright line
          quote: "© FAST Pinball LLC"
        - ref: "https://skill-shot.com/venue/fast-pinball-hq/"
          locator: in the venue listing's Address block
          quote: "FAST Pinball HQ [...] 3226 Harborview Drive, Suite 8 Gig Harbor, WA 98335"
      name: FAST Pinball LLC
      manufacturer: fast-pinball
      location: [usa/wa/gig-harbor]
  - system.fast-pinball:
      create: true
      note: "Cardona's implementation pairs its CPD CPU with the FAST controller and sound board. The CPU is a PC-class computer - its port panel names HDMI video outputs, USB and Ethernet - so the PC subgeneration follows."
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: he wanted all the manufacturers on the same hardware which is why I had to switch to the FAST platform
        - ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/ebc2f84f-c8c0-4c41-a7ee-dc72c462c785/FT%20release%202026%2007%2013.pdf"
          locator: "PDF document page 1"
          quote: DO NOT plug the USB into any slots on the FAST controller or the FAST sound board.
        - ref: "youtube:o-XezhzIBvg"
          quote: "says HDMI 1, playfield monitor, Ethernet, there's no connection. HDMI HDMI 2 speaker panel monitor. You got two USB cable connections"
      name: FAST Pinball
      manufacturer: fast-pinball
      technology_subgeneration: ss-pc
  - person.james-cardona:
      create: true
      cite:
        ref: "https://www.kineticist.com/news/james-cardona-interview"
        quote: "Back in April, James Cardona released Fish Tales: Ultimate Fishing Challenge, the third kit from his company, Cardona Pinball, with a fourth still to come."
      name: James Cardona
  - person.jada-holmes:
      create: true
      cite:
        ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/6cdf589b-48c6-4fad-8f56-e481d6474fa6/FT%20release%202026%2006%2012.pdf"
        locator: "PDF document page 2"
        quote: Added announcer voices from Jada Holmes
      name: Jada Holmes
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "An official, licensed, commercially sold product is produced rather than aftermarket."
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "Back in April, James Cardona released Fish Tales: Ultimate Fishing Challenge, the third kit from his company, Cardona Pinball, with a fourth still to come."
        - ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/6cdf589b-48c6-4fad-8f56-e481d6474fa6/FT%20release%202026%2006%2012.pdf"
          locator: "PDF document page 2"
          quote: FT 2026 05 05 First Commercial Release
      production_status: produced
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "The manufacturer's own release history labels 2026-05-05 the First Commercial Release; the April dates elsewhere read as launch-event framing."
      cite:
        ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/6cdf589b-48c6-4fad-8f56-e481d6474fa6/FT%20release%202026%2006%2012.pdf"
        locator: "PDF document page 2"
        quote: FT 2026 05 05 First Commercial Release
      month: 5
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "The kit installs into a pinball machine and its result is a new pinball game, so the format follows."
      cite:
        ref: "https://www.kineticist.com/news/james-cardona-interview"
        quote: "It's a 2.0 kit, a category of officially licensed products that install into classic Bally/Williams machines and turns them into a new game experience, while keeping the original intact."
      game_format: pinball
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "The announcement video's auto-captions render the title 'Fishtails'. The license is from Williams/Planetary Pinball Supply."
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "It's a 2.0 kit, a category of officially licensed products that install into classic Bally/Williams machines and turns them into a new game experience, while keeping the original intact."
        - ref: "youtube:1p6cpLBQJwk"
          quote: "our third title, uh, officially licensed title from, uh, you know, Williams Planetary Pinball Supply is Fishtails"
      model_relationship:
        - target_machine: fish-tales
          relationship_type: conversion_kit
          license_status: licensed
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "Two LCD monitors: a 15-inch main screen in the new speaker panel and a second 5-inch playfield screen in the Stretch the Truth location."
      cite:
        ref: "youtube:mvRdWatAink"
        quote: "It's a 15 inch screen [...] there's a second five inch screen"
      display_type: lcd
  - model.fish-tales-ultimate-fishing-challenge-kit:
      note: "The FAST platform is a computerized game system, so the solid-state generation follows."
      cite:
        ref: "https://www.kineticist.com/news/james-cardona-interview"
        quote: "He writes the code, designs the games, and has brought in more professional artists and voice actors with each title, while FAST Pinball handles the hardware."
      technology_generation: solid-state
      system: fast-pinball
  - model.fish-tales-ultimate-fishing-challenge-kit:
      cite:
        ref: "https://www.kineticist.com/news/james-cardona-interview"
        quote: "He writes the code, designs the games, and has brought in more professional artists and voice actors with each title, while FAST Pinball handles the hardware."
      credit:
