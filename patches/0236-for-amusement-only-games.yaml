        - charles-wolf: music
  - model.drained:
      cite:
        ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
        quote: "It also features classic pinball elements like a physical bell and mechanical knocker – and brings back a notorious pinball feature that hasn't been seen in nearly 60 years: the gobble hole."
      gameplay_feature: [bells, knockers, gobble-holes]
  - model.drained:
      note: "The six drop targets sit in dual sweepable banks per the press release. The press release's 20 standup targets wins over the article body's count of twenty-two (maker beats outlet; user ruling 2026-08-13)."
      cite:
        - ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: "Drained includes 15 unique vampires to hunt, seven target sequences, 54 unique songs, 75 sound effects, more than 1,300 voice-acted callouts from 17 actors, dual banks of sweepable drop targets, a pop bumper and 20 standup targets, as well as a gorgeous pen-and-ink, hand-drawn art package."
        - ref: "https://www.pinballnews.com/site/2023/10/02/drained-bite-sized"
          quote: "It comes with its very own retro-themed P3 playfield module featuring an array of standup targets, twin ball launchers, six drop targets, a pop bumper and a gobble hole."
      gameplay_feature:
        [{ standup-targets: 20 }, { pop-bumpers: 1 }, { drop-targets: 6 }]
  - model.drained:
      note: "The Wing Slings are slingshot mechanisms concealed in the central bat plastic; the bespoke identity is a future unique feature, recorded in the family notes."
      cite:
        ref: "https://foramusementonlygames.com/drained.html"
        locator: in the Unique Mechanisms list
        quote: "Wing Slings: The central bat plastic hides a secret - slingshot mechanisms!"
