claims:
  - corporate-entity.for-amusement-only-games:
      cite:
        - ref: "https://foramusementonlygames.com/"
          locator: in the page footer
          quote: "Copyright © For Amusement Only Games, LLC"
        - ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: the all-new game game kit from For Amusement Only Games LLC (FAOG)
      name: "For Amusement Only Games, LLC"
  - corporate-entity.for-amusement-only-games:
      cite:
        - ref: "https://store.foramusementonlygames.com/about"
          locator: in the About Us section
          quote: "For Amusement Only Games manufactures and distributes P³ pinball platforms and game kits, and many other items, in Richmond, VA. We are proud to be the only pinball manufacturer to have existed in Richmond!"
        - ref: "https://foramusementonlygames.com/"
          locator: in the page footer
          quote: "Address: 3301 Rosedale Ave Ste D, Richmond, VA 23230"
        - ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: "The company manufactures game kits in Richmond, Va., and ships to customers worldwide."
      location: [usa/va/richmond]
  - person.nick-baldridge:
      create: true
      note: "Founder-designer of For Amusement Only Games; Nick per his own manual signature and most coverage, with the press release's formal Nicholas Baldridge as an alias."
      cite:
        - ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
          quote: "The first third-party combination of a game and playfield module for the P3 pinball platform has been announced by game developer, podcaster and bingo expert, Nick Baldridge."
        - ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: "said Nicholas Baldridge, owner of FAOG and designer of Drained"
      name: Nick Baldridge
      person_alias: [Nicholas Baldridge]
  - person.molly-baldridge:
      create: true
      cite:
        ref: "https://www.pinballnews.com/site/2022/11/21/drained-launched"
        quote: "The physical and digital artwork is by Molly Baldridge, while the extensive soundtrack – featuring 54 unique songs composed specifically for the game – is by Charles Wolf Music."
      name: Molly Baldridge
  - person.sophia-baldridge:
      create: true
      note: "The Pinside post is the designer's own launch thread (author bingopodcast; Pinball News identifies the maker as 'game developer, podcaster and bingo expert, Nick Baldridge')."
      cite:
        - ref: "https://silverfallsforever.com/"
          quote: "Silver Falls is the latest game from Nick Baldridge, creator of Ranger In The Ruins, and his first collaboration with Sophia Baldridge"
        - ref: "https://pinside.com/pinball/forum/topic/p3-game-flipper-foxtrot-rhythm-explosion"
          locator: in the topic's game list
          quote: "Silver Falls (populate a house and complete various tasks as a custom avatar you design, with beautiful chillhop music by Scott Danesi, and co-designed with my daughter, Sophia)"
      name: Sophia Baldridge
  - person.charles-wolf:
      create: true
      cite:
        ref: "https://www.pinballnews.com/site/2025/07/01/steelbound-announced"
        quote: "Steelbound is the work of Nick and his talented team, including Jon Chad on artwork, Soliu Jamiu on character and 3D model animations, and Charles Wolf who composed and performed the soundtrack."
      name: Charles Wolf
  - person.johnny-haxby:
      create: true
      cite:
        ref: "https://foramusementonlygames.com/projects/qfg.html"
        quote: "A second artist, Johnny Haxby, was hired to draw the backglass artwork."
