  - model.old-time:
      create: true
      note: 'tilt.it gives no year; lineage per the source line: Part of Pasini''s ''Old ...'' series (Old Bend, Old Gold, Old Time). Per tilt page comments these Bologna machines were hand-built from recovered parts of old American models (''flipper non originali, cioe'' creati con parti di recupero da vecchi modelli americani... costruito praticamente a mano''). Maker: Pasini (catalog CE pasini)..'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/pasini'
        quote: Old Time
      name: Old Time
      title: old-time
      corporate_entity: pasini
      technology_generation: electromechanical
      player_count: 1
      game_format: pinball
  - model.count-down-pasini:
      create: true
      note: 'tilt.it gives no year; lineage per the source line: Unknown original; shares its name with Novamatic''s 1970 ''Count Down'' (ipdb 4118, catalog count-down-2) and LORI''s Count-Down - relationship unresolved. Maker: Pasini..'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/pasini'
        quote: Count Down
      name: Count Down
