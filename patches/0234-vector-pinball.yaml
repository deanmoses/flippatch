claims:
  - person.jason-mcnally:
      create: true
      name: Jason McNally
  - person.peter-hughes:
      create: true
      name: Peter Hughes
  - person.jeremy-ham:
      create: true
      name: Jeremy Ham
  - location.australia/qld:
      create: true
      note: "Created to host Brisbane; Brisbane is Queensland's capital."
      name: Queensland
      slug: qld
      parent: australia
      location_type: state
  - location.australia/qld/brisbane:
      create: true
      cite:
        ref: "https://vectorpinball.com/contact"
        quote: "We are based in Brisbane, Australia and ship to the world"
      name: Brisbane
      slug: brisbane
      parent: australia/qld
      location_type: city
  - corporate-entity.vector-pinball:
      note: "The maker's own About and Contact pages give its identity and base: Vector Pinball is the pinball-manufacturing division of Vector Synergy Pty Ltd (ABN 82 660 426 344), Brisbane."
      cite:
        ref: "https://vectorpinball.com/about"
        quote: "Vector Pinball is a division of Vector Synergy Pty Ltd ABN 82 660 426 344. We are based in Brisbane, Australia."
      location: [australia/qld/brisbane]
  - model.eight-ball-fury:
      note: "The maker's About page states quantity production of this title, and the machine is on sale and operating on location."
      cite:
        - ref: "https://vectorpinball.com/about"
          quote: 'In 2023 we decided to move entirely over to new game production and create our first original title, "Eight Ball Fury" and produce these in quantity.'
        - ref: "https://vectorpinball.com/eight-ball-fury-specs"
          quote: "Priced at $12,900 inc GST (Buyers outside Australia are exempt from this 10% sales tax)."
      production_status: produced
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-specs"
        quote: This limited-Edition Game (50 Units Only)
      production_quantity: 50
      tag: [limited-edition]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "2 Flippers [...] 2 Sling Shots [...] 3 Pop Bumpers [...] Standard Pinball Tilt Bob Mech"
      game_format: pinball
  - model.eight-ball-fury:
      note: "Classified as a floor-standing cabinet from the full-size dimensions on the maker's spec sheet."
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "Dimensions (Setup) 140cm L (inc shooter) x 73cm W, 204cm H with Topper installed, 186cm High with no Topper fitted"
      cabinet: floor
  - model.eight-ball-fury:
      note: "The spec sheet's 'Static Targets' are stationary standup targets."
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "2 Flippers [...] 2 Sling Shots [...] 3 Pop Bumpers [...] 1 Spinner [...] 1 Captive Ball shot [...] 9 Static Targets"
      gameplay_feature:
        [
          { flippers: 2 },
          { slingshots: 2 },
          { pop-bumpers: 3 },
          { spinners: 1 },
          { captive-ball: 1 },
          { standup-targets: 9 },
        ]
  - model.eight-ball-fury:
      note: "Six individual (solitary) drop targets, software-dropped, played in timed challenge modes."
      cite:
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: "6 Individual Drop Targets, with Auto Drop feature"
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: you have 40 seconds to knock down all 6 drop targets
      gameplay_feature: [{ solitary-drop-targets: 6 }, timed-drop-targets]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "2,3 & 4 ball Multi-Ball modes"
      gameplay_feature: [2-ball-multiball, 3-ball-multiball, 4-ball-multiball]
  - model.eight-ball-fury:
      note: "Five lettered upper rollover lanes with lane change."
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: E I G H T upper lanes & B A L L Lower rollover lanes with lane change feature
      gameplay_feature: [{ top-lanes: 5 }, lane-change]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "Skill Shot, Extra Ball, Jackpot & Super Jackpot, Bonus Hold features"
      gameplay_feature: [skill-shot]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: Horseshoe shot in playfield centre (alternating shots to add to the challenge)
      gameplay_feature: [horseshoe-lanes]
  - model.eight-ball-fury:
      note: "A ball that drains within the owner-adjustable minimum play time is automatically returned to the player, which is a ball save."
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: "Minimum play time is 10 seconds from the first score on each ball, if the ball drains within that time it will be auto returned to you."
      gameplay_feature: [ball-save]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: Standard Pinball Shooter with upgraded Chrome Rod. Auto Shooter built in for use when required
      gameplay_feature: [plungers, auto-launch]
  - model.eight-ball-fury:
      cite:
        ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
        quote: Cabinet Inner Mirror Blades to spread the light and create an infinity effect around the playfield.
      gameplay_feature: [mirror-blades]
  - model.eight-ball-fury:
      cite:
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: "Eight Ball Fury, illuminated 3D Flame Topper included"
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: "End of Game lucky Number match, Old School Knocker built in to Alert Match & Replays Awarded"
      gameplay_feature: [toppers, knockers]
  - model.eight-ball-fury:
      cite:
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: "100% LED Lighting throughout for long life, keeps game bright and inviting"
        - ref: "https://vectorpinball.com/eight-ball-fury-rules-features"
          quote: Quality 3 Speaker Sound system
      gameplay_feature: [led-general-illumination, { speakers: 3 }]
  - model.eight-ball-fury:
      note: "The credits follow Kineticist's Design Team listing for this machine; the maker's own pages and videos carry no credit lines, and its gallery attributes the artwork only to an Australian designer."
      cite:
        ref: "https://www.kineticist.com/games/pinball/eight-ball-fury-2024"
        locator: in the Design Team section
        quote: "Design [...] Jason McNally [...] Art [...] Jeremy Ham"
      credit:
        - jason-mcnally: design
        - jeremy-ham: art
  - model.peter-brock-king-of-the-mountain-torana:
      note: "Both Peter Brock models were on retail sale at the Australasian Gaming Expo in August 2024, and the maker's own About page dates its Australian Centric licensed titles to 2024, so the year is 2024 rather than the 2025 recorded elsewhere."
      cite:
        - ref: "https://ausretrogamer.com/peter-brock-king-of-the-mountain-pinball-machines"
          locator: article dateline 20/08/2024
          quote: 'Leaving a burnout at last week''s AGE – the Australasian Gaming Expo (August 13 to 15), was Vector Pinball''s Peter Brock "King Of The Mountain" pinball machines – which were the talk of the exhibition.'
        - ref: "https://vectorpinball.com/about"
          quote: 2024 brought more new titles including some Australian Centric licensed ones.
      year: 2024
  - model.peter-brock-king-of-the-mountain-torana:
      note: "Machines were retailing at the Australasian Gaming Expo in August 2024 and both variations remain on sale from the maker."
      cite:
        - ref: "https://vectorpinball.com/peter-brock-king-of-the-mountain-pinball-games"
          quote: "Priced at $13,900 inc GST (Buyers outside Australia are exempt from this 10% sales tax)."
        - ref: "https://ausretrogamer.com/peter-brock-king-of-the-mountain-pinball-machines"
          quote: "Both variations of the King Of The Mountain retail for AU$11,900 (GST inclusive)!"
      production_status: produced
