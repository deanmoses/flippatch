attribution: flipcommons-catalog
description: >
  Vector Pinball: two new models and details across the maker's five machines
sources:
  - name: AUSRETROGAMER
    source_type: web
    description: >
      Australian retro gaming and pinball news site.
    links:
      - {
          url: "https://ausretrogamer.com/",
          label: AUSRETROGAMER,
