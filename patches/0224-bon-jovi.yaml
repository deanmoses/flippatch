  - model.bon-jovi:
      note: "Ramps carry no count: 2 plastic ramps, 1 metal ramp and 2 metal jump ramps leave any single total ambiguous, so only the jump-ramp subtype carries one."
      cite:
        - ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
          locator: in the press release reprinted verbatim in the article
          quote: "2 Lightning Flippers, 2 Mini Flippers, 6 Balls [...] 2 Plastic Ramps, 2 Metal Jump Ramps, 1 Metal Ramp, [...] 4 Chrome Wire Habitrails, 1 Subway, 2 Scoops, [...] 1 Vertical Upkick, 3 Magnets, 2 Spinners, 2 Diverters, [...] 2 Drop Targets, 2 Physical 3-Ball Locks, 1 Captive Ball"
        - ref: "https://www.barrelsoffun.com/wp-content/uploads/2026/07/BJ-Flyer.pdf"
          locator: "PDF document page 2 of 2; the flyer carries no printed folios"
          quote: "2 Lightning Flippers, 2 Mini Flippers, 6 Balls [...] 2 Plastic Ramps, 2 Metal Jump Ramps, 1 Metal Ramp, 4 Chrome Wire Habitrails, 1 Subway, 2 Scoops, 1 Vertical Upkick, 3 Magnets, 2 Spinners, 2 Diverters, 2 Drop Targets, 2 Physical 3-Ball Locks, 1 Captive Ball"
      gameplay_feature:
