          { mini-flippers: 2 },
          { balls: 6 },
          ramps,
          { jump-ramps: 2 },
          { habitrails: 4 },
          { subways: 1 },
          { scoops: 2 },
          { vertical-up-kickers: 1 },
          { magnets: 3 },
          { spinners: 2 },
          { diverters: 2 },
          { drop-targets: 2 },
          { ball-locks: 2 },
          { captive-ball: 1 },
        ]
  - model.bon-jovi:
      note: "The Steel Horse's hidden magnet diverts the ball, so it is a diverter magnet; Backstage's magnet catch is a stop magnet; the Crowd Amp-Up Loop's captive ball with a spinner inside is a captive ball spinner. Standup targets carry no count: the 3 stated are scoped to the Backstage block and the machine total is unstated."
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
        locator: in the press release reprinted verbatim in the article
        quote: 'Bon Jovi Heart & Dagger Magnetic Ball Catch & Diverter: Take a "Shot Through the Heart" with this versatile 3-level diverter & jump ramp that sends the ball along one of three unique paths! [...] Steel Horse 3-Ball Lock: Buck up, Cowboy! A hidden magnet along the back orbit can divert the ball into a vertical upkick that feeds a physical 3-ball lock [...] Crowd Amp-Up Loop Captive Ball & Spinner: This first-ever loop-de-loop captive ball with a spinner inside is designed to pump up the crowd! [...] Backstage Access: Your pass to a variety of shots featuring 3 standup targets, a spinner, an exit ramp, hidden scoop, & magnet catch that diverts the ball to a physical 3-ball lock'
      gameplay_feature:
        [diverter-magnets, stop-magnets, captive-ball-spinners, standup-targets]
  - model.bon-jovi:
      note: "The Heart & Dagger sculpt catches and holds the ball, so it is a ball-holding toy; Jon's New Jersey Guitar sculpt has no stated motion or ball interaction, so it is a static toy."
      cite:
        - ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
          locator: in the press release reprinted verbatim in the article
          quote: "High-Fidelity Sculpts: Bon Jovi Heart & Dagger and Jon's Iconic New Jersey Guitar"
        - ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
          locator: in the press release reprinted verbatim in the article
          quote: Bon Jovi Heart & Dagger Magnetic Ball Catch & Diverter
      gameplay_feature: [ball-holding-toys, static-toys]
  - model.bon-jovi:
      note: "HAL is the maker's branded interactive inner-cabinet lighting."
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
        locator: in the press release reprinted verbatim in the article
        quote: "Spotlights & Trusses: Custom metal trussing along the left and back of the stage includes 3 functional spotlights [...] Horizon Atmospheric Lighting (HAL): An RGBW LED Low-Profile Inner Cabinet Lighting System for Complete Concert Experience Lighting Effects [...] All-RGBW LED Playfield Insert Lamps & General Illumination Lamps, and Playfield Apron Flood Lights"
      gameplay_feature:
        [
          horizon-atmospheric-lighting,
          led-general-illumination,
          { stage-spotlights: 3 },
        ]
  - model.bon-jovi:
      note: "Infinity Glass is the maker's branded anti-reflective playfield glass; 'Thunder From Down Under' is its branding for the shaker motor."
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
        locator: in the press release reprinted verbatim in the article
        quote: "EverGloss High-Gloss Decal Art [...] Infinity Glass (Anti-Reflective Glass) [...] Thunder From Down Under Shaker Motor [...] Factory-Installed Inner Blade Art [...] Polyester Metallic Powder Coated Cabinet Armor"
      gameplay_feature:
        [infinity-glass, cabinet-armor, art-blades, shaker-motors]
  - model.bon-jovi:
      note: "The speakers' Interactive Full RGBW Illumination is interactive speaker lighting."
      cite:
        - ref: "https://www.pinballnews.com/site/2026/07/28/bon-jovi-revealed"
          locator: in the press release reprinted verbatim in the article
          quote: 'Full-Range Stereo Speakers with Interactive [...] Full RGBW Illumination [...] 8" Cabinet Subwoofer'
        - ref: "https://www.barrelsoffun.com/wp-content/uploads/2026/07/BJ-Flyer.pdf"
          locator: "PDF document page 2 of 2; the flyer carries no printed folios"
          quote: '15.6" HD LCD Display flanked by 5-1/4" Full-Range Stereo Speakers with Interactive Full RGBW Illumination'
      gameplay_feature: [stereo-sound, subwoofers, interactive-speaker-lighting]
