      create: true
      note: 'tilt.it gives no year; no technology is stated; lineage per the source line: donor not stated on page; note existing unrelated games Williams ''Hit and Run Base-Ball'' (ipdb 1193, 1970) and H & M ''Hit and Run'' (ipdb 3992, 1933). Classified a conversion kit by its membership in tilt.it''s unidentified-kits section; the page names no donor.'
