      create: true
      note: 'tilt.it gives no year; no technology is stated; lineage per the source line: donor not stated on page; note existing unrelated games Williams ''Hit and Run Base-Ball'' (ipdb 1193, 1970) and H & M ''Hit and Run'' (ipdb 3992, 1933). tagged conversion-kit on the section''s membership (tilt.it files it among the unidentified Italian kits); the page states no per-machine kit detail.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
        quote: Hit and Run
      name: Hit and Run
      title: hit-and-run-kit
      game_format: pinball
      tag: [conversion-kit]
