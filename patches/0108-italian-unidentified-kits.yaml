  - model.happening:
      create: true
      note: 'no technology is stated; lineage per the source line: donor not stated; art by ''Mike'' (his first work per tilt.it); sold as a conversion kit; the page names no donor.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
