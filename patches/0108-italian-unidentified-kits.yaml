attribution: flipcommons-catalog
description: >
  Italian conversion kits whose makers tilt.it cannot identify.
claims:
  # ==========================================================================
  # Every model here is a conversion KIT (relationship_type: conversion_kit —
  # "compatible with" a donor), all filed by tilt.it in its "unidentified Italian
  # kits" section. license_status is unknown throughout (no source addresses
  # authorization; Italy had no import ban to imply one). The donor is recorded at
  # whatever resolution the source supports:
  #   - a named, seeded donor -> target_machine (Harmony/Troubadour kits carry two
  #     edges, one per compatible donor);
  #   - a described-but-unseeded/generic donor -> target_label ("electromechanical
  #     machines");
  #   - no donor stated at all -> target_label "unknown donor" (the kit itself is
  #     sourced; the donor simply is not).
  # ==========================================================================
  - person.de-angelis:
      create: true
      name: De Angelis
  - title.hit-and-run-kit:
      create: true
      note: 'Title for Hit and Run, per the tilt.it Italian Pinball Database.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
        quote: Hit and Run
      name: Hit and Run
  - title.pool-kit:
