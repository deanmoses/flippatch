      note: 'tilt.it gives no year; lineage per the source line: based on Gottlieb ''Card Trix'' (ipdb 446, 1970); explicitly NOT the RMG version and not the Gottlieb Italian export (ipdb 3748, catalog card-trix-2). tilt.it''s per-machine remark distinguishes it from RMG''s version rather than describing the kit; the kit classification rests on its section membership.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
        quote: Card Trix
      name: Card Trix
      title: card-trix-kit
