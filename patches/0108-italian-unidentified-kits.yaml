  - model.card-trix-kit:
      create: true
      note: 'tilt.it gives no year; lineage per the source line: based on Gottlieb ''Card Trix'' (ipdb 446, 1970); explicitly NOT the RMG version and not the Gottlieb Italian export (ipdb 3748, catalog card-trix-2). tilt.it''s per-machine remark distinguishes it from RMG''s version rather than describing the kit; the tag rests on the section''s membership.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
        quote: Card Trix
      name: Card Trix
      title: card-trix-kit
      technology_generation: electromechanical
      game_format: pinball
      tag: [conversion-kit]
  - model.happening:
      create: true
      note: 'no technology is stated; lineage per the source line: donor not stated; art by ''Mike'' (his first work per tilt.it); sold as a conversion kit.'
      cite:
        ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
        quote: Happening (ver.1)
      name: Happening
      title: happening
      year: 1970
      game_format: pinball
      tag: [conversion-kit]
      changesets:
        - note: 'tilt.it credits the art to "Mike"; IPDB records the artist Michele "Mike" Martinelli on other Italian machines of this era (and all the Geiger conversion kits), so "Mike" is read as Martinelli.'
          cite:
            ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
            quote: first work by Mike
          credit:
            - michele-mike-martinelli: art
  - model.full-kit:
      create: true
      note: 'tilt.it gives no year; no technology is stated; lineage per the source line: donor not stated; art by ''Mike'', possibly same (unidentified) producer as ''Happening''. tagged conversion-kit on the section''s membership (tilt.it files it among the unidentified Italian kits); the page states no per-machine kit detail.'
