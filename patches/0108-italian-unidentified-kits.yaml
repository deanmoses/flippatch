      create: true
      note: 'tilt.it gives no year; no technology is stated; lineage per the source line: renamed backglass for Williams ''Cue-T'' (ipdb 611, Williams Electronics, 1968); tilt.it says it is more a redone glass than a full kit; sold as a conversion kit.'
