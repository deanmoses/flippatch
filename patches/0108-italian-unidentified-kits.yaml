      year: 1970
      game_format: pinball
      model_relationship:
        - target_label: unknown donor
          relationship_type: conversion_kit
          license_status: unknown
      changesets:
        - note: 'tilt.it credits the art to "Mike"; IPDB records the artist Michele "Mike" Martinelli on other Italian machines of this era (and all the Geiger conversion kits), so "Mike" is read as Martinelli.'
          cite:
            ref: 'https://www.tilt.it/flipper_pinball/ipdb/ipdb-flipper-kit-italiani-non-identificati'
            quote: first work by Mike
          credit:
