attribution: flipcommons-catalog
description: >-
  Year and one-ball game format for Bally's Turf King and Champion.
sources:
  - name: Pinball Collectors Resource
    source_type: web
    description: Collector reference site archiving pinball history articles and technical documentation.
    links:
      - {
          url: "http://www.pinballcollectorsresource.com/",
          label: Pinball Collectors Resource,
          link_type: homepage,
        }
claims:
  - model.turf-king:
      changesets:
        - cite:
            - ref: "ipdb:2672"
              quote: "IPD No. 2672 / April 12, 1950 / 1 Player"
            - ref: https://bingo.cdyn.com/history/mcp/racy.html
              quote: "Bally Turf King - 1950"
          production_year: 1950
        - note: "The replay (non-payout) form of the one-ball horse-race genre; its payout twin is Bally's 1950 'Grandstand', and the Skill Lane was the alternate configuration for jurisdictions requiring 5-ball play."
          cite:
            - ref: "ipdb:2672"
              quote: "Theme: Sports - Horse Racing [...] Trap holes (31), Passive bumpers (4). Skill Lane option for 5-ball jurisdictions. [...] Turf King is the replay version of the payout game Bally's 1950 'Grandstand'."
            - ref: https://www.kineticist.com/news/a-beginners-guide-to-bingo-pinball
              quote: 'One of the final "one ball" games Bally produced – ''Turf King'', which is the replay version of ''Grandstand''.'
          game_format: one-ball
  - model.champion-4:
      changesets:
        - cite:
            ref: "ipdb:3008"
            quote: "IPD No. 3008 / April 04, 1949 / 1 Player"
          production_year: 1949
        - cite:
            - ref: "ipdb:3008"
              quote: "1 ball for 5 cents. Trap holes (31), Passive bumpers (4). Skill Lane option for 5-ball jurisdictions."
            - ref: http://www.pinballcollectorsresource.com/russ_files/bally.html
              quote: 'Bally made two significant improvements in their One-Ball Horserace pinballs in 1949. [...] Shortly after that "Reflex Play" was introduced in CHAMPION.'
          game_format: one-ball
