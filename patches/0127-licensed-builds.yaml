      expect: { ipdb_id: 6692 }
      slug: arena-vifico
      title: arena
      cite:
        ref: ipdb:6692
        quote: "A copy of Premier's 1987 'Arena' manufactured by VIFICO S.A. under license from Gottlieb/Premier."
      model_relationship:
        - target_machine: arena
