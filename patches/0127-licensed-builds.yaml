attribution: flipcommons-catalog
description: Lineage of foreign under-license editions of US/Spanish games.
claims:
  # ==========================================================================
  # Foreign under-license editions — a licensee/subsidiary built a complete copy
  # of another maker's design UNDER LICENSE for its own market.
  #
  # The licence is sourced on every row; each IPDB note says "under license" /
  # "under licence" verbatim (quoted in the cite).
  #
  # Contrast 0140 Maresa / 0145 Petaco / 0148 RMG, copies with NO authorization
  # source (license_status: unknown).
  #
  # Models having the same name as the model of which it is a copy are merged
  # under the original's title.  Also, the slug is renamed to end in the maker
  # (arena-vifico, dracula-lai …) to make for clearer URLs and wikilinks.
  # ==========================================================================

  # ------------------------------------------------------------------------
  # VIFICO S.A. (Spain) — licensed Gottlieb/Premier builds
  # ------------------------------------------------------------------------
