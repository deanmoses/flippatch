attribution: flipcommons-ai-desc-franchise
description: >
  Narrative descriptions for franchises.
claims:
  - franchise.battle-dome:
      expect: { name: Battle Dome }
      note: "Adds a narrative description for the Battle Dome franchise, tracing the property from its US rights holder Anjar Co. through Tsukuda Original's home toy to Sunwise's 1995 coin-op adaptation. Supported by the cited wikipedia page."
      description: |
        Battle Dome (バトルドーム) is a head-to-head, flipper-driven ball game whose rights originate with the US firm Anjar Co. and which became a hit in Japan through toy maker Tsukuda Original, which released the home version *American Battle Dome* (アメリカンバトルドーム) in 1994. Up to four players surround a domed table and work spring-loaded flippers to fire balls into one another's goals; balls are released at intervals by a wind-up mechanism, and the player left holding the fewest balls wins. The property crossed into amusement machines in 1995 when [[manufacturer:sunwise]] adapted it into the coin-op flipper game [[model:american-battle-dome]]. Tsukuda Original extended the toy line with Super American Battle Dome (1996), a *Doraemon*-licensed edition, and a 1995 Super Famicom video-game version; after the company's absorption into Bandai the property passed to Palbox and then Megahouse, which reissued it as Action Battle Dome (2010) and again as a 30th-anniversary edition in 2024.[[cite:1]]
      cites:
        "1":
          ref: "https://en.wikipedia.org/wiki/Battle_Dome_(toy)"
          quote: 'The Battle Dome (バトルドーム, Batoru Dōmu) was a pinball board game from the American company Anjar. It was released from Tsukuda Original in Japan, in which the company was taken over by Pal Box and Megahouse. On 29 July 2010, Megahouse renewed the toy as Action Battle Dome. [...] The game consists as a pinball game from two to four players. [...] The game starts when the player puts the balls in the upper part, the balls are dropped at regular intervals by the mainspring. [...] The aim is to not have the balls in the player''s goal. [...] the player with the lowest score wins. [...] American Battle Dome (アメリカンバトルドーム, Amerikan Batoru Dōmu)[1] - Sold in October 1994 by Tsukuda Original. [...] This version was re-released in 2024 for the 30th anniversary by Bandai Namco using the same visual design. [...] American Battle Dome (video game) - Released by Tsukuda Original[3] on 8 December 1995.[4] - The platform is the Super Nintendo Entertainment System. [...] American Battle Dome (arcade game) - Released by Sun Wise in 1995. [...] Super American Battle Dome (スーパーアメリカンバトルドーム, Sūpā Amerikan Batoru Dōmu) - Released by Tsukuda Original. [...] Doraemon Battle Dome (ドラえもんバトルドーム, Doraemon Batoru Dōmu)[7] - Released from Tsukuda Original on 20 November 1999.'
  - franchise.ultraman:
      expect: { name: Ultraman }
      note: "Adds a narrative description for the Ultraman franchise, the Tsuburaya Productions superhero property that Nihon Gorakuki and Nihon Tenbo's c.1972 Ultra Attack / Ultra Spark machine adapts. Supported by the cited Wikipedia page."
      description: |
        Ultraman (ウルトラマン) is Tsuburaya Productions' tokusatsu superhero franchise, launched in 1966, whose giant silver-and-red heroes defend Earth from kaiju and alien invaders across a long-running television series. Its 1971 series *Return of Ultraman* introduced the hero Ultraman Jack and the defense unit MAT (Monster Attack Team), which [[manufacturer:nihon-goraku-ki-kabushikigaisha]] (Nihon Gorakuki) and [[manufacturer:nihon-tenbo]] drew on for a c.1972 [[technology-generation:electromechanical]] machine, issued in two versions as [[model:ultra-attack]] and [[model:ultra-spark]].[[cite:1]]
      cites:
        "1":
          ref: "https://en.wikipedia.org/wiki/Ultraman"
          quote: 'Ultraman, also known as the Ultra Series (ウルトラシリーズ, Urutora Shirīzu), is a Japanese science fiction media franchise owned and produced by Tsuburaya Productions, which began with the television series Ultra Q in 1966. The franchise has expanded into many television shows, films, comic books, and other media publications, becoming one of the most prominent productions in the Japanese tokusatsu and kaiju genres and pioneering the Kyodai Hero subgenre. The Ultraman series is centered on a fictional alien race of superheroes who often combat kaiju or other aliens. [...] The show Ultraman was followed by many other series. Successors during the Shōwa era are: Ultraseven (1967), Return of Ultraman (1971), Ultraman Ace (1972), Ultraman Taro (1973), Ultraman Leo (1974) and Ultraman 80 (1980). [...] Also known as Ultraman Jack'
