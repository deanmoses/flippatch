attribution: flipcommons-catalog
description: >
  The 3 Musketeers (HEXA 2026): naming, production, credits, features
sources:
  - name: HEXA Pinball
    slug: hexa-pinball
    source_type: document
    description: >
      First-party game documentation published by HEXA Pinball.
  - name: The 3 Musketeers Product Specification Sheet (March 2026)
    slug: the-3-musketeers-product-specification-sheet-2026
    parent: hexa-pinball
    source_type: document
    year: 2026
    month: 3
    description: >
      Two-sheet product specification sheet from the March 20, 2026 reveal press kit: game
      experience, modes, credits and digital functions on the front; playfield features,
      experience features, physical specifications and the per-edition columns on the back.
    links:
      - {
          url: "https://www.pinballnews.com/site/wp-content/uploads/games/three-musketeers/024--three-musketeers.jpg",
          label: "Pinball News copy, front sheet",
          link_type: catalog,
        }
      - {
          url: "https://www.pinballnews.com/site/wp-content/uploads/games/three-musketeers/025--three-musketeers.jpg",
          label: "Pinball News copy, back sheet",
          link_type: catalog,
        }
claims:
  - gameplay-feature.atmoslight:
      create: true
      name: Atmoslight
      gameplay_feature_parent: [rgb-playfield-inserts]
      gameplay_feature_alias:
        [AtmosLight, Atmoslight Inserts, Atmoslight Surrounding System]
  - person.tristan-fallon:
      create: true
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "front sheet; beside the machine photo"
        quote: Exclusive Art by Tristan Fallon
      name: Tristan Fallon
  - person.herve-coussillan:
      create: true
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "front sheet; beside the machine photo"
        quote: "Exclusive Soundtracks by Hervé Coussillan"
      name: "Hervé Coussillan"
  - person.luis-dos-santos:
      create: true
      note: "HEXA's own site interviews him as a game designer (the Space Hunt era 'Interview with Luis Dos Santos' page); his 3 Musketeers design credit is carried by Kineticist's Design Team block."
      cite:
        ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
        quote: "Game Design: Luis Dos Santos"
      name: Luis Dos Santos
  - model.the-3-musketeers:
      note: "An earlier ingest created this model under the plain title name; the maker's own materials name the two editions Classic and Elegance, so the base model takes the maker's edition name (user-approved rename, 2026-08-12)."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; heading of the Classic column"
          quote: CLASSIC EDITION
        - ref: "https://www.hexa-pinball.com/en/produit/the-3-musketeers"
          quote: "Classic Edition [...] Experience all the intensity of the game, the original epic adventure"
      name: The 3 Musketeers (Classic Edition)
  - model.the-3-musketeers:
      note: "Announced per the vocabulary (officially revealed but not yet shipped) as of authoring, 2026-08-12: the newest timeline statement has first shipments merely expected, and no shipping-began statement was found."
      cite:
        - ref: "https://www.pinballnews.com/site/2026/03/20/the-3-musketeers-revealed"
          quote: "Hexa Pinball today released full details of their second title, The 3 Musketeers, based on the famed novel by Alexandre Dumas."
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "HEXA says first shipments are expected within three months, roughly June 2026."
      production_status: announced
  - model.the-3-musketeers:
      cite:
        ref: "https://www.hexa-pinball.com/en/produit/the-3-musketeers"
        quote: "this pinball machine plunges you into the adventure of d'Artagnan, an ambitious young Gascon who dreams of joining the prestigious Musketeers in the service of King Louis XIII of France"
      game_format: pinball
  - model.the-3-musketeers:
      note: "Month records the announcement month (campaign convention, GTF Victory precedent): both editions were revealed March 20, 2026, in HEXA's dual Bordeaux / Texas Pinball Festival launch."
      cite:
        ref: "https://www.pinballnews.com/site/2026/03/20/the-3-musketeers-revealed"
        quote: "Date: March 20th, 2026"
      month: 3
  - model.the-3-musketeers:
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "front sheet; beside the machine photo"
          quote: Exclusive Art by Tristan Fallon
        - ref: "https://www.pinballnews.com/site/2026/03/20/the-3-musketeers-revealed"
          quote: "Artwork is by Tristan Fallon, while the music comes from Hervé Coussillan."
      credit:
        - tristan-fallon: art
  - model.the-3-musketeers:
      note: "The maker's own label is 'Exclusive Soundtracks by'; the music role follows."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "front sheet; beside the machine photo"
          quote: "Exclusive Soundtracks by Hervé Coussillan"
        - ref: "https://www.pinballnews.com/site/2026/03/20/the-3-musketeers-revealed"
          quote: "Artwork is by Tristan Fallon, while the music comes from Hervé Coussillan."
      credit:
        - herve-coussillan: music
  - model.the-3-musketeers:
      note: "Kineticist's Design Team block labels him 'Music / Sound'; the sound role follows in addition to the music credit the maker's sheet supports."
      cite:
        ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
        quote: "Music / Sound: Hervé Coussillan"
      credit:
        - herve-coussillan: sound
  - model.the-3-musketeers:
      note: "Kineticist's Design Team block is the only non-crowdsourced source naming this credit; corroborating first-party sources were sought at authoring time and none found (the maker's specification sheet credits only art, soundtracks and engineering, and no manual exists yet)."
      cite:
        ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
        quote: "Game Design: Luis Dos Santos"
      credit:
        - luis-dos-santos: design
  - model.the-3-musketeers:
      note: "'Electronic Engineering' has no dedicated role in the closed credit-role vocabulary, so the credit maps to the other role; the block label is recorded here. Kineticist's Design Team block is the only non-crowdsourced source naming this credit; corroborating first-party sources were sought at authoring time and none found (the maker's specification sheet credits only art, soundtracks and engineering, and no manual exists yet)."
      cite:
        ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
        quote: "Electronic Engineering: Romain Fontaine"
      credit:
        - romain-fontaine: other
  - model.the-3-musketeers:
      note: "Counts follow the sheet's PLAYFIELD FEATURES list. Balls attach as 7 with the extra mini-ball preserved in the quote (no mini-ball vocabulary; 3Musketeers.md keeps it on the future-unique-features list). Treville's Mansion's '3 Bank Drop Target' attaches as one 3-bank; the single three-ball La Rochelle Harbor lock attaches as ball-locks with count 1 (the Bon Jovi shape). Ramps attach as the sheet's own count of 3. The specification sheet is edition-neutral and the maker's own comparison table differs only in cosmetic items, so the playfield features are facts about both editions."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the PLAYFIELD FEATURES list"
          quote: "3 Bank Drop Target, Ramp, Diverter, Hidden Mini-Ball Shot [...] 3 Balls Lock La Rochelle Harbor [...] 3 Ramps: [...] VUK Treville's Mansion Roof [...] Captive Ball of the Queen's Diamonds Studs [...] 1 Spinner [...] 2 Flippers [...] 7 Balls + 1 Mini-Ball"
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "Gameplay is identical across editions — the Elegance is a cosmetic and tactile upgrade, not a mechanical one."
      gameplay_feature:
        [
          { flippers: 2 },
          { balls: 7 },
          { spinners: 1 },
          { ramps: 3 },
          { 3-bank-drop-targets: 1 },
          { ball-locks: 1 },
          { vertical-up-kickers: 1 },
          { captive-ball: 1 },
        ]
  - model.the-3-musketeers:
      note: "Four diverter rows on the sheet: the cannon platform, the mansion courtyard (hidden), Notre Dame's Forest (hidden) and the back board. The specification sheet is edition-neutral and the maker's own comparison table differs only in cosmetic items, so the playfield features are facts about both editions."
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "back sheet; in the PLAYFIELD FEATURES list"
        quote: "Canon platform Diverter [...] Treville's Mansion courtyard Hidden Diverter [...] Notre Dame's Forest Hidden Diverter [...] Back board Diverter"
      gameplay_feature: [{ diverters: 4 }]
  - model.the-3-musketeers:
      note: "The Milady de Winter sculpt is a repeatable bash target under the center ramp."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the PLAYFIELD FEATURES list"
          quote: Bash Toy Milady de Winter
        - ref: "https://www.pinballnews.com/site/2026/03/20/the-3-musketeers-revealed"
          quote: Both appear on the playfield with the latter represented by a bash toy under a lift ramp.
      gameplay_feature: [{ bash-toys: 1 }]
  - model.the-3-musketeers:
      note: "A swinging ship of the English fleet, timed shots required."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the PLAYFIELD FEATURES list"
          quote: Swing Target ship of the English fleet
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "A swinging ship representing the English fleet. It moves, so you have to time your shots to connect."
      gameplay_feature: [{ swinging-targets: 1 }]
  - model.the-3-musketeers:
      note: "A physical cannon that fires the ball, themed to the Battle of La Rochelle; its platform diverter is counted in the diverters entry."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the PLAYFIELD FEATURES list"
          quote: Canon Mechanism Battle of La Rochelle
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "a physical cannon fires the ball from its own platform, with a dedicated diverter routing shots into it"
      gameplay_feature: [{ ball-cannons: 1 }]
  - model.the-3-musketeers:
      note: "Treville's Mansion is an explicitly three-level play area on an otherwise single-level playfield."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the PLAYFIELD FEATURES list"
          quote: "3-level play area Treville's Mansion:"
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "The main playfield is single-level (unlike Space Hunt's elevated mini-playfield with its pendulum shot), so this multi-level section stands out as the mechanical showpiece."
      gameplay_feature: [multi-level-playfield]
  - model.the-3-musketeers:
      cite:
        ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
        quote: "Three-ball lock themed to the harbor, feeding into multiball."
      gameplay_feature: [multiball]
  - model.the-3-musketeers:
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "front sheet; in the DIGITAL & GAMEPLAY FUNCTIONS list"
        quote: "INTEGRATED VIDEO MODES [...] Narrative sequences and interactive [...] missions displayed on screen."
      gameplay_feature: [video-modes]
  - model.the-3-musketeers:
      note: "A 2.1 system is a stereo pair plus subwoofer; the Pinsound branding stays in the quote (no equipment-brand vocabulary is created for it)."
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "back sheet; in the EXPERIENCE FEATURES list"
        quote: "Speakers and Subwoofer by Pinsound [...] 2.1 Sound System with 48V amplifier"
      gameplay_feature: [stereo-sound, subwoofers]
  - model.the-3-musketeers:
      note: "Atmoslight is HEXA's branded RGB playfield-insert lighting system (resin inserts bonded into the playing surface), attached as the branded leaf under rgb-playfield-inserts; 'Sytem' and 'pattented' are the sheet's own spellings."
      cite:
        - ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
          locator: "back sheet; in the EXPERIENCE FEATURES list"
          quote: "Atmoslight Surrounding Sytem [...] with pattented Atmoslight Inserts [...] 400+ RGB LEDs"
        - ref: "https://www.kineticist.com/news/hexa-3-musketeers-pinball"
          quote: "The AtmosLight inserts, resin pieces bonded to the wood with epoxy, are integrated directly into the playing surface."
      gameplay_feature: [atmoslight]
  - model.the-3-musketeers:
      note: "The Classic Edition's armor is Musketeer's Blue powder coat."
      cite:
        ref: "hexa-pinball:the-3-musketeers-product-specification-sheet-2026"
        locator: "back sheet; in the CLASSIC EDITION block"
        quote: Musketeer's Blue Powder coated finish Armor
      gameplay_feature: [cabinet-armor]
