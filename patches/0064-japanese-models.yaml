attribution: flipcommons-catalog
description: >
  Additional details about some early-Japanese EM models.
claims:
  - model.dai-uchuu-ryokou:
      expect: { ipdb_id: 5572 }
      changesets:
        - display_type: backglass-lights
          cite:
            ref: ipdb:5572
            quote: 'Bulb scoring, no score reels.'
        - cabinet: floor
          cite:
            ref: ipdb:5572
            quote: 'Wedge head backbox.'
        - game_format: miscellaneous
          cite:
            ref: ipdb:5572
            quote: 'This game is based on a sugoroku game, a Japanese variety of Parcheesi.'
        - cite:
            ref: https://earlyarcadesjapan.blogspot.com/2022/02/introduction.html
            quote: '1970 大宇宙旅行 (big space travel) by 日本自動販売機 (Nihon Jidô Hanbaiki)'
          year: 1970
  - model.fishing-tengu:
      expect: { ipdb_id: 6872 }
      changesets:
        - cite:
            ref: ipdb:6872
            quote: 'We notice a red knob on the front of the cabinet, below the regular ball shooter knob.'
          cabinet: floor
        - cite:
            ref: https://earlyarcadesjapan.blogspot.com/2022/02/introduction.html
            quote: '1973 つり天狗 (Fishing Tengu) by 三共 (Sankyo)'
          year: 1973
  - model.attack-ball:
      expect: { ipdb_id: 6874 }
      changesets:
        - cabinet: floor
          cite:
            ref: ipdb:6874
            quote: 'The unusual lower cabinet appears to be padded or upholstered.'
        - game_format: miscellaneous
          cite:
            ref: ipdb:6874
            quote: 'It dispenses prizes into a receptacle at the bottom of the cabinet front.'
        - cite:
            ref: https://earlyarcadesjapan.blogspot.com/2022/02/introduction.html
            quote: '1975 Attack Ball - アタック ボール by 三共 (Sankyo)'
          year: 1975
  - model.circus-16:
      expect: { ipdb_id: 6871 }
      changesets:
        - cite:
            ref: ipdb:6871
            quote: 'Wedge head.'
          cabinet: floor
        - cite:
            ref: https://earlyarcadesjapan.blogspot.com/2022/02/introduction.html
            quote: '1975 サーカス (Circus) by 三共 (Sankyo)'
          year: 1975
