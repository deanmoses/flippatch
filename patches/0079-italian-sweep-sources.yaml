attribution: flipcommons-catalog
# Website roots the Italian sweep cites. tilt.it hosts the Italian Pinball
# Database (IPDB.it) under /flipper_pinball/ipdb/ — one page per Italian
# manufacturer; like the eremeka catalog for early-Japanese games, it is
# original research, effectively primary for obscure Italian-made machines.
# dallapria.it is the Dalla Pria firm's own site — first-party evidence for
# that maker.
description: Seed the web citation roots cited by the Italian sweep.
sources:
  - name: TILT.IT
    source_type: web
    description: >
      Italian pinball site, home of IPDB.it — the Italian Pinball Database,
      the reference archive of Italian-made pinball machines, online since
      1995.
    links:
      - { url: "https://www.tilt.it/", label: TILT.IT, link_type: homepage }
  - name: Dalla Pria
    source_type: web
    description: >
      Corporate site of the Dalla Pria group of Piove di Sacco, Italy —
      amusement-machine producer and distributor, in the game sector since
      1958.
    links:
      - { url: "https://www.dallapria.it/", label: Dalla Pria, link_type: homepage }
  - name: RetroCampus
    source_type: web
    description: >
      Italian retrocomputing and videogame-history magazine; documents the
      Italian coin-op industry.
    links:
      - { url: "https://retrocampus.com/", label: RetroCampus, link_type: homepage }
  - name: Zaccaria Pinball (fan archive)
    source_type: web
    description: >
      Fan-maintained archive dedicated to Zaccaria and the Bologna pinball
      industry: company history, machine lists and restoration documentation.
    links:
      - { url: "https://www.zaccaria-pinball.com/", label: Zaccaria Pinball, link_type: homepage }
  - name: Arcade History
    source_type: web
    description: Database of coin-op arcade machines and their manufacturers.
    links:
      - { url: "https://www.arcade-history.com/", label: Arcade History, link_type: homepage }
  - name: ArcadeItalia
    source_type: web
    description: Italian arcade-gaming community and collector forum.
    links:
      - { url: "http://www.arcadeitalia.net/", label: ArcadeItalia, link_type: homepage }
  - name: Il Sole 24 Ore
    source_type: web
    description: Italy's leading financial daily newspaper.
    links:
      - { url: "https://www.ilsole24ore.com/", label: Il Sole 24 Ore, link_type: homepage }
    domains:
      - en.ilsole24ore.com
  - name: Impresa Italia
    source_type: web
    description: >
      Italian business-registry aggregator — company name, legal form,
      registered address and ATECO trade classification for registered firms.
    links:
      - { url: "https://www.impresaitalia.info/", label: Impresa Italia, link_type: homepage }
  - name: Flippers.be
    source_type: web
    description: Belgian pinball collector reference site with maker and machine histories.
    links:
      - { url: "https://www.flippers.be/", label: Flippers.be, link_type: homepage }
  - name: La Nouvelle Vague
    source_type: web
    description: Italian film and television culture magazine.
    links:
      - { url: "https://www.lanouvellevague.it/", label: La Nouvelle Vague, link_type: homepage }
  - name: Pac-Man Fandom
    source_type: web
    description: Community-maintained Pac-Man wiki hosted on Fandom.
    links:
      - { url: "https://pacman.fandom.com/", label: Pac-Man Fandom, link_type: homepage }
  - name: Pinball Repair & History (pinrepair.com)
    source_type: web
    description: Clay Harrell's pinball repair and history reference site.
    links:
      - { url: "https://www.pinrepair.com/", label: pinrepair.com, link_type: homepage }
  - name: Planet World Cup
    source_type: web
    description: Historical reference site for past FIFA World Cup tournaments.
    links:
      - { url: "https://www.planetworldcup.com/", label: Planet World Cup, link_type: homepage }
  - name: SAPAR
    source_type: web
    description: Associazione Nazionale SAPAR, the Italian amusement and gaming trade association.
    links:
      - { url: "https://www.sapar.it/", label: SAPAR, link_type: homepage }
  - name: Seattle Pinball Museum
    source_type: web
    description: Seattle Pinball Museum; per-machine history and feature pages.
    links:
      - { url: "https://seattlepinballmuseum.com/", label: Seattle Pinball Museum, link_type: homepage }
  - name: Strananet
    source_type: web
    description: Italian retro-gaming and technology-culture site.
    links:
      - { url: "https://www.strananet.it/", label: Strananet, link_type: homepage }
  - name: Taste Bologna
    source_type: web
    description: Bologna food and culture site; documents the city's pinball history.
