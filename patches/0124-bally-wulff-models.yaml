  # ---------------------------------------------------------------------------
  # Hardbody — Bally Midway 1987 (model:hardbody) + Bally Wulff's Hardbody, and
  # Super Sport, Bally Wulff's re-backglassed/renamed edition of its Hardbody.
  # ---------------------------------------------------------------------------
  - model.hardbody:
      expect: { ipdb_id: 1122 }
      cite:
        ref: ipdb:1122
        quote: "Flippers (4), Slingshots (2), Standup targets (16), Star rollovers (6), Flex-save lanes (2), 3-bank drop targets (1), 3-in-line drop targets (3), Mechanically raised/lowered ramps (2)."
      game_format: pinball
      flipper_count: 4
  - model.hardbody-2:
      expect: { ipdb_id: 3137 }
      note: >
        Bally Wulff's licensed German edition of Bally Midway's 1987 Hardbody
        (model:hardbody). Merged under the hardbody title with the slug renamed to match; OPDB has no record of the Bally
        Wulff build, so a single title contradicts nothing there.
      slug: hardbody-bally-wulff
      title: hardbody
      changesets:
        - cite:
            ref: ipdb:3137
            quote: "A version of Bally Midway's 1987 'Hardbody' made in Germany."
          model_relationship:
            - target_machine: hardbody
              relationship_type: copy
              license_status: licensed
        - cite:
            ref: ipdb:3137
            quote: "Flippers (4), Slingshots (2), Standup targets (16), Star rollovers (6), Flex-save lanes (2), 3-bank drop targets (1), 3-in-line drop targets (3), Mechanically raised/lowered ramps (2)."
          game_format: pinball
          flipper_count: 4
  - model.super-sport:
      expect: { ipdb_id: 6105 }
      changesets:
        - cite:
            ref: ipdb:6105
            quote: "This is the same game as Bally Wulff's 1987 'Hardbody' but with a different backglass that shows the women wearing more clothing."
          # Reference the current slug: the FK resolves to the model object, which
          # this same patch renames to hardbody-bally-wulff.
          variant_of: hardbody-2
        - note: >
            Bally Wulff's re-backglassed, renamed edition of its own Hardbody
            (model:hardbody-bally-wulff) — offered after operators objected to the
            body-builder artwork — which is itself the licensed German build of
            Bally Midway's Hardbody (model:hardbody); so this is recorded as a
            licensed build of the US Hardbody and carries the licensed-build tag,
            with the variant_of link above capturing its direct sibling relation to
            the Bally Wulff Hardbody. It keeps its own Super Sport title, since the
            renamed edition is a distinct name rather than a same-name build.
          model_relationship:
            - target_machine: hardbody
              relationship_type: copy
              license_status: licensed
        - cite:
            ref: ipdb:6105
            quote: "Flippers (4), Slingshots (2), Standup targets (16), Star rollovers (6), Flex-save lanes (2), 3-bank drop targets (1), 3-in-line drop targets (3), Mechanically raised/lowered ramps (2)."
          game_format: pinball
          flipper_count: 4

  # ---------------------------------------------------------------------------
  # Black Belt / Karate Fight — Bally Midway 1986 Black Belt (model:black-belt)
  # + Bally Wulff's Karate Fight (already sharing the black-belt-karate-fight
  # title; OPDB binds them in group G562j).
  # ---------------------------------------------------------------------------
  - model.black-belt:
      expect: { ipdb_id: 303 }
      cite:
        ref: ipdb:303
        quote: "Flippers (4), Pop bumpers (2), Mushroom bumper (1), 3-bank standup targets (4), 3-bank drop targets (2), Rollunders (3), Kick-out holes (2), Spinning target (1), Ball kicker (1), Right outlane detour gate."
      game_format: pinball
      flipper_count: 4
  - model.karate-fight:
      expect: { ipdb_id: 1346 }
      changesets:
        - note: >
            Bally Wulff's licensed German build of Bally Midway's 1986 Black Belt
            (model:black-belt). Bally Midway itself exported Black Belt to Europe
            under the Karate Fight name (a backglass rename), and Bally Wulff
            produced this German edition under that same name. OPDB binds it to
            Black Belt in group G562j (its G562j-MLWYq to the US G562j-MDyoK), and
            it already shares the black-belt-karate-fight title, so no title change
            is needed. IPDB's note for this record only cross-references the game,
            so the lineage rests on that binding rather than a source quote.
          model_relationship:
            - target_machine: black-belt
              relationship_type: copy
              license_status: licensed
        - cite:
            ref: ipdb:1346
            quote: "Flippers (4), Pop bumpers (2), Mushroom bumper (1), 3-bank standup targets (4), 3-bank drop targets (2), Rollunders (3), Kick-out holes (2), Spinning target (1), Ball kicker (1), Right outlane detour gate."
