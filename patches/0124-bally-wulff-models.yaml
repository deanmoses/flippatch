        ref: ipdb:212
        quote: "Flippers (3), Pop bumpers (3), 6-bank drop targets (1), Single drop target (1), Kick-out holes (2), Star rollovers (3), Left crossover return lane."
      game_format: pinball
      flipper_count: 3
  - model.beat-the-clock-3:
      expect: { ipdb_id: 4518 }
      note: >
        Bally Wulff's licensed German edition of Bally Midway's 1985 Beat the
        Clock (model:beat-the-clock-2). Merged under the beat-the-clock title
        with the slug renamed to disambiguate the two builds; OPDB has no record of the Bally Wulff build, so a
        single title contradicts nothing there.
      slug: beat-the-clock-bally-wulff
      title: beat-the-clock
      changesets:
        - cite:
            ref: ipdb:4518
            quote: "Produced by: Bally Wulff, Berlin, West Germany under Licence of Bally Midway Mfg Company, USA"
          model_relationship:
            - target_machine: beat-the-clock-2
              relationship_type: copy
              license_status: licensed
        - cite:
            ref: ipdb:4518
            quote: "Flippers (3), Pop bumpers (3), 6-bank drop targets (1), single drop target (1), Kick-out holes (2)."
          game_format: pinball
          flipper_count: 3

