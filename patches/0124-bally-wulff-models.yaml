  # ---------------------------------------------------------------------------
  # Special Force — Bally Midway 1986 (model:special-force) + Bally Wulff's
  # Special Force Girls (already sharing the special-force title; OPDB catalogues
  # it as alias GRDkX-M61RE-A1qKR of the US machine). Convert its variant_of
  # link to licensed_build_of.
  # ---------------------------------------------------------------------------
  - model.special-force:
      expect: { ipdb_id: 2272 }
      cite:
        ref: ipdb:2272
        quote: "Flippers (2), Pop bumpers (3), Drop targets (3-in line, and two solo ones), 3-ball multiball."
      game_format: pinball
      flipper_count: 2
  - model.special-force-girls:
      expect: { ipdb_id: 3270 }
      changesets:
        - retract: [variant_of]
          note: >
            Replace the variant_of link with the licensed_build_of below: this is
            Bally Wulff's licensed German edition of Bally Midway's 1986 Special
            Force (model:special-force), re-backglassed and renamed for the German
            market. It keeps its distinct Special Force Girls name and already
            shares the special-force title.
        - cite:
            ref: ipdb:3270
            quote: "'Special Force Girls' is the same game as Bally Midway's 1986 'Special Force' but with a different backglass."
