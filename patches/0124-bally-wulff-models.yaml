attribution: flipcommons-catalog
description: Bally Wulff licensed builds - lineage, title merges, scalar data.
claims:
  # ---------------------------------------------------------------------------
  # Party Animal — the pattern this patch generalises. Bally Midway's US
  # original, and Bally Wulff's German licensed edition merged under its title.
  # ---------------------------------------------------------------------------
  - model.party-animal:
      expect: { ipdb_id: 1763 }
      cite:
        ref: ipdb:1763
        quote: First pinball game to have the sounds of a belch and a flushing toilet.
      game_format: pinball
  - model.party-animal-2:
      expect: { ipdb_id: 3293 }
      note: >
        This is Bally Wulff's own edition of Bally Midway's 1987 Party Animal
        (model:party-animal): the corporate entity is already bally-wulff, and
        the machine carries the same name and the same distinctive bar/home
        root-beer-stein translite as the US original. Bally Wulff was Bally's
        licensed German subsidiary and built European production runs of Bally
        Midway solid-state pinballs (see the manufacturer and licensed-build tag
        descriptions), so this is recorded as a licensed build of the US Party
        Animal. Merged under the party-animal title — OPDB catalogues only the US
        machine (group G42Zz), so a single title contradicts nothing there.
      slug: party-animal-bally-wulff
      title: party-animal
      model_relationship:
        - target_machine: party-animal
          relationship_type: copy
          license_status: licensed
      changesets:
        - cite:
            ref: ipdb:3293
            quote: "Flippers (3), Ramps (2), Out Holes (3)."
          game_format: pinball

  # ---------------------------------------------------------------------------
