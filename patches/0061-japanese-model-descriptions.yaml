attribution: flipcommons-ai-desc-model
description: >
  Narrative descriptions for early-Japanese models.
claims:
  # --- Nihon Tenbo ---
  - model.home-run-nihon-tenbo:
      expect: { year: 1967 }
      description: |
        Home Run (ホームランゲーム) is a baseball-themed [[technology-generation:electromechanical]] flipper game by [[manufacturer:nihon-tenbo]], dating to around 1967. Its playfield layout closely resembles Sankyo's later [[model:the-world-series]].[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2023/01/home-run-by-japan-outlook-entertainment.html
          quote: "Home Run - ホームランゲーム [...] ~1967 [...] 日本展望娯楽社 (Nihon Tenbo)"
  - model.soccer-ace:
      expect: { year: 1969 }
      description: |
        Soccer Ace (サッカーエース) is a 1969 soccer-themed flipper game by [[manufacturer:nihon-tenbo]].[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1969 Socker Ace - サッカーエース (Soccer Ace) by 日本展望娯楽社 (Nihon Tenbo Entertainment Company — Nitten) [...] theme ~ sports ~ football (soccer) [...] yokomono ~ flipper pinball"
  - model.beat-spark:
      expect: { year: 1970 }
      description: |
        Beat & Spark (ビート＆スパーク) is a 1970 soccer-themed ("Socker") flipper game by [[manufacturer:nihon-tenbo]], built with the Tokyo Corporation.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1970 ビート & スパーク (Beat & Spark) [Socker] by 東急商事株式會社 (Tokyo Corporation) & 日本展望娯楽社 (Nihon Tenbo) [...] theme ~ sports ~ football (soccer) [...] yokomono ~ flipper pinball"
  - model.jumbokick:
      expect: { year: 1970 }
      description: |
        Jumbo Kick (ジャンボキック) is a 1970 flipper game by [[manufacturer:nihon-tenbo]], built with the Tokyo Corporation.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1970 ジャンボ キック (Jumbo Kick) by 東急商事株式會社 (Tokyo Corporation) & 日本展望娯楽社 (Nihon Tenbo) [...] yokomono ~ flipper pinball"
