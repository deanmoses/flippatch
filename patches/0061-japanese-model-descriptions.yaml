        Target Machine Pirates (ターゲットマシン パイレーツ) is a pirate-themed candy-vending flipper game by [[manufacturer:tomato-land]], dating to around 2010.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "2010s ターゲットマシン パイレーツ (Target machine pirates) by トマトランド (Tomato Land) [...] theme ~ pirates [...] vending machine ~ candy [...] yokomono ~ flipper pinball"
  # --- Towa ---
  - model.slap-shot-towa:
      expect: { year: 1996 }
      description: |
        Slap Shot (スラップショット) is a hockey-themed flipper game by [[manufacturer:towa]], made in 1996, with a 1997 version.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1996 Slap Shot - スラップショット by トーワ (Towa) [...] theme ~ sports ~ hockey [...] yokomono ~ flipper pinball [...] 1997 Slap Shot - スラップショット by トーワ (Towa)"
  # --- Sunwise ---
  - model.american-battle-dome:
      expect: { year: 1995 }
      description: |
        American Battle Dome (アメリカンバトルゲーム) is a 1995 head-to-head flipper game by [[manufacturer:sunwise]], adapting Tsukuda Original's [[franchise:battle-dome]] toy.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1995 American Battle Dome - アメリカンバトルゲーム by サンワイズ (Sunwise) & Tsukuda Original [...] players ~ head-to-head [...] yokomono ~ flipper pinball"
  # --- Sankyo (primary entity) ---
  - model.apollo-moon:
      expect: { year: 1972 }
      description: |
        Apollo Moon (アポロムーン) is a 1972 space-themed flipper game by [[manufacturer:sankyo-seiki]] (Sankyo).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1972 Apollo Moon - アポロムーン by 三共 (Sankyo) [...] theme ~ space/UFOs/scifi [...] yokomono ~ flipper pinball"
  - model.the-world-series:
      expect: { year: 1972 }
      description: |
        The World Series (ワールドシリーズ) is a baseball-themed flipper game by [[manufacturer:sankyo-seiki]] (Sankyo) dating to 1972; its playfield uses balls to run a baseball diamond. A 1976 re-release was sold as [[model:new-world-series]].[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2022/06/the-world-series-by-sankyo.html
          quote: "Name: The World Series - ワールドシリーズ Year: 1972, 1976 Manufacturer: 三共 (Sankyo) [...] The playfield is dominated by a baseball diamond which uses balls to simulate players running around the bases. [...] The 1976 re-release is referred to as ニューワールドシリーズ (New World Series) in Sankyo's advertisements."
  - model.big-race-sankyo:
      expect: { year: 1969 }
      description: |
        Big Race (ビックレース) is a car-racing [[technology-generation:electromechanical]] flipper game by [[manufacturer:sankyo-seiki]] (Sankyo). It appeared in the 1969 machine directory and may be older.[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2024/06/big-race-by-sankyo.html
          quote: "Name: ビックレース (Big Race) Year: 1969 or earlier Company: 三共 (Sankyo) [...] It appeared in the 1969 machine directory, but could be from an earlier year."
  - model.japan-series:
      expect: { year: 1969 }
      description: |
        Japan Series (日本シリーズ) is a baseball-themed flipper game by [[manufacturer:sankyo-seiki]] (Sankyo), dating to around 1969.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1969 Nihon リーズ - 日本シリーズ (Japan Series) by 三共 (Sankyo) [...] theme ~ sports ~ baseball [...] yokomono ~ flipper pinball"
  - model.advantage:
      expect: { year: 1976 }
      description: |
        Advantage (アドバンテージ) is a 1976 tennis-themed flipper game by [[manufacturer:sankyo-seiki]] (Sankyo).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1976 Advantage - アドバンテージ by 三共 (Sankyo) [...] theme ~ sports ~ tennis [...] yokomono ~ flipper pinball"
  - model.american-football:
      expect: { year: 1976 }
      description: |
        American Football (アメリカンフットボール) is a 1976 American-football-themed flipper game by [[manufacturer:sankyo-seiki]] (Sankyo).[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1976 American Football - アメリカンフットボール by 三共 (Sankyo) [...] theme ~ sports ~ football (american) [...] yokomono ~ flipper pinball"
  - model.new-world-series:
      expect: { year: 1976 }
      description: |
        New World Series (ニューワールドシリーズ) is the 1976 re-release of Sankyo's [[model:the-world-series]], by [[manufacturer:sankyo-seiki]]; Sankyo's advertisements called it New World Series.[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2022/06/the-world-series-by-sankyo.html
          quote: "Name: The World Series - ワールドシリーズ Year: 1972, 1976 Manufacturer: 三共 (Sankyo) [...] The 1976 re-release is referred to as ニューワールドシリーズ (New World Series) in Sankyo's advertisements."
  # --- Sankyo (amusement-park entity) ---
  - model.new-big-race:
      expect: { year: 1972 }
      description: |
        New Big Race (ニュービッグレース) is a car-racing flipper game by [[manufacturer:sankyo-yuen-setsubi-kabushikigaisha]] (Sankyo), dated to 1972 from its listing in the 1973 machine directory printed in late 1972.[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2025/09/new-big-race-by-sankyo.html
          quote: "New Big Race appears in the 1973 game directory, which was printed in late 1972. [...] TAN 91-4910 was registered by Sankyo in 1970. [...] The 1972 print date of the machine directory is the only date we have, and the one we will use for the time being."
  # --- Komaya ---
  - model.crazy-15-mark-ii:
      expect: { year: 1965 }
      description: |
        Crazy 15 [Mark II] (クレイジー15ゲーム) is a 1965 variant of [[manufacturer:komaya-seisakusho]]'s [[model:crazy-15-15]] flipper game.[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2022/03/15-crazy-15-by-komaya.html
          quote: "クレイジー15ゲーム [クレイジーフィフティーンゲーム] [マークII] (Crazy 15 game [mark II]) [...] 1965 [...] こまや (Komaya)"
  - model.crazy-15-mark-iii:
      expect: { year: 1969 }
      description: |
        Crazy 15 [Mark III] (クレイジー15ゲーム) is a 1969 variant of [[manufacturer:komaya-seisakusho]]'s [[model:crazy-15-15]] flipper game.[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2022/04/1970-15-2nd-version-crazy-15-by-komaya.html
          quote: "クレイジー15ゲーム [マークIII] (Crazy 15 game mark III) [...] 1969 [...] こまや (Komaya) [...] Crazy 15 was first released in 1965. This version came out in 1969 and has a few differences."
  - model.saturn-komaya:
      expect: { year: 1969 }
      description: |
        Saturn (サターン号) is a space-themed flipper game by [[manufacturer:komaya-seisakusho]], dating to around 1969.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1969 Saturn - サターン号 by こまや (Komaya) [...] theme ~ space/UFOs/scifi [...] yokomono ~ flipper pinball"
  - model.ware-sea-rover:
      expect: { year: 1969 }
      description: |
        Ware Sea Rover (海賊ゲーム, "pirate game") is a pirate-themed flipper game by [[manufacturer:komaya-seisakusho]], dating to around 1969.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1969 Ware Sea Rover - 海賊ゲーム (pirate game) by こまや (Komaya) [...] theme ~ pirates [...] yokomono ~ flipper pinball"
  - model.ronin:
      expect: { year: 1970 }
      description: |
        Ronin (浪人) is a 1970 samurai-themed flipper game by [[manufacturer:komaya-seisakusho]].[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2023/05/1970-ronin.html
          quote: "Year: 1970 Company: こまや (Komaya) [presumed] [...] This suggests to me that Namakura was distributing Komaya games, and implies that Ronin was also by Komaya."
  - model.pocket-ball:
      expect: { year: 1974 }
      description: |
        Pocket Ball (ポケットボール) is a 1974 flipper game by [[manufacturer:komaya-seisakusho]].[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1974 ポケットボール (Pocket Ball) by こまや (Komaya) [...] yokomono ~ flipper pinball"
  - model.indy-game:
      expect: { year: 1967 }
      description: |
        Indy Game (インディゲーム) is a car-racing [[technology-generation:electromechanical]] flipper game by [[manufacturer:komaya-seisakusho]], dating to around 1967.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1967 Indy Game - インディゲーム by こまや (Komaya) [...] theme ~ vehicles ~ cars [...] yokomono ~ flipper pinball"
  - model.lets-go-moon:
      expect: { year: 1968 }
      description: |
        Let's Go Moon! is a space-themed flipper game by [[manufacturer:komaya-seisakusho]], dating to around 1968.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1968 Let's Go Moon! - レッッゴームーン by こまや (Komaya) [...] theme ~ space/UFOs/scifi [...] yokomono ~ flipper pinball"
  # --- Universal (Japan) ---
  - model.orienteering:
      expect: { year: 1976 }
      description: |
        Orienteering (オリエンテーリング) is a 1976 two-player flipper game by [[manufacturer:universal]].[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "1976 Orienteering - オリエンテーリング by ユニバーサル (Universal) [...] players ~ 2 players [...] yokomono ~ flipper pinball"
  - model.asteroid-killer:
      expect: { year: 1979 }
      description: |
        Asteroid Killer is a 1979 flipper game with a video-game element by [[manufacturer:universal]].[[cite:1]][[cite:2]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2026/05/1979-asteroid-killer-by-universal.html
          quote: "The only image I've seen of Asteroid Killer so far is from this write-up in Play Meter 1979-12-15. [...] So if it's shown in 1979, we're marking that down as 1979."
        "2":
          ref: ipdb:3810
          quote: "Asteroid Killer [...] Manufacturer: Universal Company, Ltd., of Oyama, Japan"
  # --- Nihon Gorakuki ---
  - model.ultra-attack:
      expect: { year: 1972 }
      description: |
        Ultra Attack (ウルトラアタック) is an [[franchise:ultraman]]-based kaiju flipper game by [[manufacturer:nihon-goraku-ki-kabushikigaisha]] (Nihon Gorakuki), dating to around 1972 and co-credited with [[manufacturer:nihon-tenbo]].[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2024/03/1972-ultra-attack-by-nihon-gorakuki.html
          quote: "Year: ~1972 Company: 日本娯楽機 (Nihon Gorakuki) & 日本展望娯楽社 (Nihon Tenbo) [presumed] [...] These machines could not exist prior to 1971 as it references characters and images from 帰ってきたウルトラマン / Return of Ultraman, like Ultraman Jack, and the MAT logo (Monster Attack Team). [...] ウルトラアタック (Ultra Attack) by 日本娯楽機 (Nihon Gorakuki) & 日本展望娯楽社 (Nihon Tenbo) [presumed]"
  - model.ultra-spark:
      expect: { year: 1972 }
      description: |
        Ultra Spark (ウルトラスパーク) is an [[franchise:ultraman]]-based kaiju flipper game by [[manufacturer:nihon-goraku-ki-kabushikigaisha]] (Nihon Gorakuki), the companion to [[model:ultra-attack]], dating to around 1972 and co-credited with [[manufacturer:nihon-tenbo]].[[cite:1]]
      cites:
        "1":
          ref: https://earlyarcadesjapan.blogspot.com/2024/03/1972-ultra-attack-by-nihon-gorakuki.html
          quote: "Year: ~1972 Company: 日本娯楽機 (Nihon Gorakuki) & 日本展望娯楽社 (Nihon Tenbo) [presumed] [...] These machines could not exist prior to 1971 as it references characters and images from 帰ってきたウルトラマン / Return of Ultraman, like Ultraman Jack, and the MAT logo (Monster Attack Team). [...] This post is for two games. [...] I only have a glimpse of it, but I want to note that Ultra Spark uses the same side cabinet art as the other model."
  # --- Nihon Jidou Hanbaiki ---
  - model.rodeo-game-mate:
      expect: { year: 1969 }
      description: |
        Rodeo (ロデオ) is a rodeo-themed flipper game by [[manufacturer:nihon-jidou-hanbaiki-kabushikigaisha]] (Game Mate), dating to around 1969.[[cite:1]]
      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "~1969 ロデオ (Rodeo) by 日本自動販売機 (Nihon Jidô Hanbaiki — Game Mate) [...] yokomono ~ flipper pinball"
