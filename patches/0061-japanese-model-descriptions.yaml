          quote: "~2007 Target Machine Tropical Q - ターゲットマシン タイプ１ (Target machine type 1) by トマトランド (Tomato Land) [...] vending machine ~ candy [...] yokomono ~ flipper pinball"
  - model.target-machine-pirates:
