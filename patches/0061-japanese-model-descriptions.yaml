      cites:
        "1":
          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "2002 キン肉マン2世 パワームーチョ (Kinnikuman II Power Mucho) by バンプレスト (Banpresto) [...] mechanic ~ prize dispenser [...] yokomono ~ flipper pinball"
