          ref: "https://thetastates.com/eremeka/eremekaDisplay.php?mentionOnly=1&search=yes&tag=yokomono+~+flipper+pinball"
          quote: "2007 Target Machine Base Ball - ターゲットマシン ベースボール by トマトランド (Tomato Land) [...] vending machine ~ candy [...] yokomono ~ flipper pinball"
