      create: true
      name: Playfield LCDs
      gameplay_feature_alias: [Playfield LCD]
  - gameplay-feature.mylar-playfield-protection:
      create: true
      name: Mylar Playfield Protection
      gameplay_feature_alias: [Factory Mylar]
  - gameplay-feature.flipper-toppers:
      create: true
      name: Flipper Toppers
      gameplay_feature_alias:
        [Custom Laser Cut Flipper Toppers, Game-Specific Flipper Toppers]
  - gameplay-feature.interior-side-art:
      create: true
      name: Interior Side Art
      gameplay_feature_parent: [art-blades]
  - gameplay-feature.mirrored-art-blades:
      create: true
      name: Mirrored Art Blades
      gameplay_feature_parent: [art-blades, mirror-blades]
  - model.houdini-master-of-mystery:
      cite:
        ref: "https://americanpinball.com/houdini/"
        quote: "Custom Padlock & Gear Bumper Tops w/ Chains [...] 6 Balls"
      gameplay_feature: [bumper-tops, { balls: 6 }]
  - model.houdini-master-of-mystery:
      note: "The steamer trunk receives launched balls, so it is a ball-holding toy."
      cite:
        ref: "https://americanpinball.com/houdini/"
        quote: 'Over 20" Launch into Houdini''s Steamer Trunk'
      gameplay_feature: [ball-holding-toys]
  - model.houdini-master-of-mystery:
      cite:
        ref: "https://americanpinball.com/houdini/"
        quote: "4 Stereo Speakers [...] Custom Powder Coated Cabinet Armour"
      gameplay_feature: [{ speakers: 4 }, stereo-sound, cabinet-armor]
