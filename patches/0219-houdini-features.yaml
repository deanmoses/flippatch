      create: true
      name: Animatronic Toys
      gameplay_feature_parent: [interactive-toys]
      gameplay_feature_alias: [Animatronic Robot Toy]
  - gameplay-feature.pop-up-toys:
      create: true
      name: Pop-Up Toys
      gameplay_feature_parent: [interactive-toys]
  - gameplay-feature.ball-holding-toys:
      create: true
      name: Ball-Holding Toys
      gameplay_feature_parent: [interactive-toys]
  - gameplay-feature.bumper-tops:
      create: true
      name: Bumper Tops
      gameplay_feature_alias: [Custom Bumper Tops]
  - gameplay-feature.rgb-playfield-inserts:
      create: true
