  - model.houdini-master-of-mystery:
      cite:
        ref: "https://americanpinball.com/houdini/"
        quote: 'API Theater Stage [...] Custom Padlock & Gear Bumper Tops w/ Chains [...] Over 20" Launch into Houdini''s Steamer Trunk [...] Real Wood Laser Engraved Planchette [...] Animated & Interactive Theatre Marquee [...] 6 Balls'
      gameplay_feature:
        [
          stages,
          bumper-tops,
          trunks,
          spirit-planchettes,
          marquees,
          { balls: 6 },
        ]
  - model.houdini-master-of-mystery:
      cite:
        ref: "https://americanpinball.com/houdini/"
        quote: "4 Stereo Speakers [...] Custom Powder Coated Cabinet Armour"
      gameplay_feature: [{ speakers: 4 }, stereo-sound, cabinet-armor]
  - model.houdini-master-of-mystery:
      cite:
        ref: "ipdb:6470"
        quote: "Theater spotlights (2) [...] Game-specific flipper toppers. Factory mylar in high-wear areas. [...] Playfield has a 4.3 inch LCD. [...] Glare-reduced playfield glass."
