attribution: flipcommons-catalog
description: >
  Houdini family presentation and mech features
claims:
  - gameplay-feature.balls:
      create: true
      name: Balls
      gameplay_feature_alias: [Ball Complement]
  - gameplay-feature.subways:
      create: true
      name: Subways
      gameplay_feature_alias: [Hidden Ball Subway System, Ball Subway]
  - gameplay-feature.toys:
      create: true
      name: Toys
  - gameplay-feature.static-toys:
      create: true
      name: Static Toys
      gameplay_feature_parent: [toys]
  - gameplay-feature.interactive-toys:
      create: true
      name: Interactive Toys
      gameplay_feature_parent: [toys]
  - gameplay-feature.bash-toys:
      create: true
      name: Bash Toys
      gameplay_feature_parent: [interactive-toys]
      gameplay_feature_alias: [Robot Bash Toy]
