          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: Please contact your authorized distributor for availability and to secure your game allocation.
        - ref: "https://www.pinballremakes.com/prodotto/deposit-preorder-europe-only-tales-of-the-arabian-nights-30th-anniversary-edition"
          quote: This payment is required to pre-order the pinball machine.
      production_status: announced
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
      cite:
        ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
        locator: in the manufacturer's press release reprinted verbatim in the article
        quote: "proudly announces its newest pinball machine: Tales of the Arabian Nights Remake."
      game_format: pinball
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
      note: "An edition is a variant of its base, and the Legacy Edition is the base: Pedretti's own Funhouse remakes take this shape (the Limited Edition is a variant of the Collector's Edition), the pricier strictly-limited edition pointing at the standard one. The maker describes this edition relative to the Legacy Edition and states both models share the newly developed feature set."
      cite:
        - ref: "https://www.pinballremakes.com/prodotto/deposit-preorder-europe-only-tales-of-the-arabian-nights-30th-anniversary-edition"
          quote: 'Like the Legacy Edition, the 30th Anniversary Edition features the 21.5" HD LCD display, the original game code, and the enhanced 1.5+ game code, combining classic gameplay with expanded modern features.'
        - ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: Both models include all of the newly developed features created specifically for this project.
      variant_of: tales-of-the-arabian-nights-legacy-edition-remake
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
      note: "The press release's 'New DMD display animations' describes the animation content of the enhanced code; the maker's product page states the hardware is a 21.5-inch HD LCD."
      cite:
        ref: "https://www.pinballremakes.com/prodotto/deposit-preorder-europe-only-tales-of-the-arabian-nights-30th-anniversary-edition"
        quote: 'Like the Legacy Edition, the 30th Anniversary Edition features the 21.5" HD LCD display, the original game code, and the enhanced 1.5+ game code, combining classic gameplay with expanded modern features.'
      display_type: lcd
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
      cite:
        - ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: "Strictly limited to only 399 units worldwide, the 30th Anniversary Edition features a completely reimagined hand-drawn art package created by renowned pinball artist Brian Allen and Flyland Designs."
        - ref: "https://www.planetarypinball.com/mm5/merchant.mvc?Product_Code=PPS-TOTAN-AE-DEPOSIT&Screen=PROD"
          locator: in the Shipping & Support section
          quote: 399 units worldwide. No second run planned.
