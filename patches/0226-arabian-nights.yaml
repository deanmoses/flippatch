attribution: flipcommons-catalog
description: >
  Tales of the Arabian Nights: 1996 original + 2026 Pedretti remakes
claims:
  - gameplay-feature.gamesync-lighting:
      create: true
      name: GameSync Lighting
      gameplay_feature_parent: [interactive-lighting]
      gameplay_feature_alias: [GameSync]
  - gameplay-feature.invisible-magic-glass:
      create: true
      name: Invisible Magic Glass
      gameplay_feature_parent: [anti-reflection-playfield-glass]
  - gameplay-feature.lighted-backpanels:
      create: true
      name: Lighted Backpanels
      gameplay_feature_alias:
        [Playfield Lighted Backpanel, Illuminated Playfield Back Panel]
  - corporate-entity.pedretti-gaming:
      note: "An earlier ingest's Podenzano (PC) survives only in third-party dealer copy, possibly describing the parent Pedretti Group. The maker's own site footer gives the Bagnatica street address and a Bergamo company-registry number (REA: BG 445013), and its June 2026 press release is datelined Bagnatica, so the coarser claim is removed and Bagnatica asserted."
      cite:
        - ref: "https://www.pinballremakes.com/"
          locator: in the site footer's Contacts block and copyright line
          quote: "Via Martin Luther King, 3 24060 - Bagnatica (BG) Italy [...] REA: BG 445013"
        - ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: "Bagnatica, Italy – June 15, 2026 – Pedretti Gaming (Pedretti), in partnership with Planetary Pinball Supply Inc."
      location: [italy/bg/bagnatica]
      remove: { location: [italy/pc/podenzano] }
  - model.tales-of-the-arabian-nights:
      cite:
        ref: "https://www.kineticist.com/news/totan-remake-launch"
        quote: "The original Tales of the Arabian Nights shipped from Williams in 1996, designed by John Popadiuk"
      production_status: produced
  - model.tales-of-the-arabian-nights:
      cite:
        ref: "ipdb:3824"
        quote: "Flippers (2), Pop bumpers (3), Slingshots (2), Electromagnets (3), Spinning posts (2), Captive balls (2), Newton ball posts (2), Kick-out hole (1), 2- 3- and 4-ball multiball, Shooter lane skill shot."
      game_format: pinball
  - model.tales-of-the-arabian-nights:
      note: "IPDB names the Genie a bash toy; the Lamp atop the spinning posts states no motion or ball interaction of its own, so it classifies as a static toy."
      cite:
        ref: "ipdb:3824"
        quote: "Toys: Lamp on top of spinning posts. Genie bash toy."
      gameplay_feature: [bash-toys, static-toys]
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      cite:
        ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
        locator: in the manufacturer's press release reprinted verbatim in the article
        quote: "Inspired by the legendary and mesmerizing 1996 original, this remake combines the magical gameplay of the classic machine with updated technology, immersive atmospheric lighting, enhanced visual effects, and modern features to create an unforgettable pinball experience for players and collectors alike. [...] Tales of the Arabian Nights Remake will be available in two different models: Legacy Edition and 30th Anniversary Edition."
      remake_of: tales-of-the-arabian-nights
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      note: "The maker and its partners sell pre-order deposits only, with the balance due before delivery and no machine yet shipping, so the machine is announced, not produced."
      cite:
        - ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: Please contact your authorized distributor for availability and to secure your game allocation.
        - ref: "https://www.pinballremakes.com/prodotto/acconto-preordine-tales-of-the-arabian-nights-legacy-edition"
          quote: This payment is required to pre-order the pinball machine.
      production_status: announced
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      cite:
        ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
        locator: in the manufacturer's press release reprinted verbatim in the article
        quote: "proudly announces its newest pinball machine: Tales of the Arabian Nights Remake."
      game_format: pinball
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      note: "The press release's 'New DMD display animations' describes the animation content of the enhanced code; the maker's product page states the hardware is a 21.5-inch HD LCD."
      cite:
        ref: "https://www.pinballremakes.com/prodotto/acconto-preordine-tales-of-the-arabian-nights-legacy-edition"
        quote: 'The machine features a large 21.5" HD LCD display, bringing the world of the Arabian Nights to life with upgraded video animations and a more dynamic visual presentation.'
      display_type: lcd
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      note: "A remake preserves the original's creative work, so the original's creative credits - design, art, animation, music, sound - carry to the remake, as with Medieval Madness and its Chicago Gaming remake. The maker frames the remake as preserving the classic machine's gameplay. Mechanics and software credits do not carry: the remake is re-engineered. The art credit carries to this edition because it retains the original 1996 artwork package."
      cite:
        - ref: "ipdb:3824"
          quote: "Design by: John Popadiuk [...] Art by: Pat McMahon [...] Dots/Animation by: Adam Rhine, Brian Morris [...] Music by: Dave Zabriskie [...] Sound by: Dave Zabriskie"
        - ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
          locator: in the manufacturer's press release reprinted verbatim in the article
          quote: The Legacy Edition features the original artwork package from the 1996 game along with custom-painted metallic trims.
      credit:
        - john-popadiuk: design
        - adam-rhine: animation
        - brian-morris: animation
        - dave-zabriskie: music
        - dave-zabriskie: sound
        - pat-mcmahon: art
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      note: "PPS's wording, 'Infinite mirror side blades', names the playfield side blades the maker's page calls Side Rails, so mirror-blades attaches. The edition's trim name and the Glowing Stars Ramp LEDs are model-specific presentation identities, recorded in the family notes."
      cite:
        - ref: "https://www.pinballremakes.com/prodotto/acconto-preordine-tales-of-the-arabian-nights-legacy-edition"
          quote: 'The cabinet is enhanced with special "Night Sky" metal armor trims, Invisible Magic Glass, Infinite Mirror Side Rails, Glowing Stars Ramp LEDs, and a Playfield Lighted Backpanel, adding depth, elegance, and modern visual presence without losing the iconic look of the original game.'
        - ref: "https://www.planetarypinball.com/mm5/merchant.mvc?Product_Code=PPS-TOTAN-LE-DEPOSIT&Screen=PROD"
          locator: in the Every Legacy Edition Includes list
          quote: Infinite mirror side blades
      gameplay_feature:
        [
          cabinet-armor,
          invisible-magic-glass,
          mirror-blades,
          lighted-backpanels,
        ]
  - model.tales-of-the-arabian-nights-legacy-edition-remake:
      note: "GameSync Lighting is Pedretti's brand of interactive lighting, here on the speakers and sidebars. The upgraded Lamp and Genie toys are the original 1996 machine's toys, retained by the remake: IPDB names the Genie a bash toy; the Lamp atop the spinning posts states no motion or ball interaction of its own, so it classifies as a static toy."
      cite:
        - ref: "https://www.pinballremakes.com/prodotto/acconto-preordine-tales-of-the-arabian-nights-legacy-edition"
          quote: "The Premium Sound System, combined with GameSync Lighting™ RGB speakers and GameSync Lighting™ RGB sidebars, creates a more powerful and engaging atmosphere. The machine also includes a shaker motor, upgraded Lamp and Genie toys, the Glitter Gold Lamp, Scorbit integration, and online software updates, allowing the game to remain current over time."
        - ref: "ipdb:3824"
          quote: "Toys: Lamp on top of spinning posts. Genie bash toy."
      gameplay_feature:
        [gamesync-lighting, shaker-motors, bash-toys, static-toys]
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
      cite:
        ref: "https://www.pinballnews.com/site/2026/06/15/tales-of-the-arabian-nights-remake-revealed"
        locator: in the manufacturer's press release reprinted verbatim in the article
        quote: "Inspired by the legendary and mesmerizing 1996 original, this remake combines the magical gameplay of the classic machine with updated technology, immersive atmospheric lighting, enhanced visual effects, and modern features to create an unforgettable pinball experience for players and collectors alike. [...] Tales of the Arabian Nights Remake will be available in two different models: Legacy Edition and 30th Anniversary Edition."
      remake_of: tales-of-the-arabian-nights
  - model.tales-of-the-arabian-nights-30th-anniversary-remake:
