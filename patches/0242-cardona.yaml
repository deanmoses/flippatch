  - model.no-good-gofers-battle-for-the-green-kit:
      note: "An official, licensed, commercially sold product, so produced rather than aftermarket (DomainModel.md defines aftermarket as not an official commercial release)."
      cite:
        - ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/b8901727-49fa-4784-801d-6663cfa49dd1/NGG%20rev%20changes%202025%2006%2001.pdf"
          locator: PDF document page 1
          quote: "version 20221215 [...] First commercial release"
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: 'when we finally released No Good Gofers: Battle For the Green, everyone was like, "Yeah, yesterday''s news."'
      production_status: produced
  - model.no-good-gofers-battle-for-the-green-kit:
      note: "The maker's release history stamps each version by date - the 20250601 sibling entry shows the YYYYMMDD convention - and labels 20221215 the first commercial release. Pinside's February 2023 reads as later framing; the maker's own document wins."
      cite:
        ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/b8901727-49fa-4784-801d-6663cfa49dd1/NGG%20rev%20changes%202025%2006%2001.pdf"
        locator: PDF document page 1
        quote: "version 20221215 [...] First commercial release"
      production_month: 12
  - model.no-good-gofers-battle-for-the-green-kit:
      note: "The kit installs into a pinball machine and its result is a new pinball game, so the format follows."
      cite:
        ref: "https://www.kineticist.com/news/james-cardona-interview"
        quote: "It's a 2.0 kit, a category of officially licensed products that install into classic Bally/Williams machines and turns them into a new game experience, while keeping the original intact."
      game_format: pinball
  - model.no-good-gofers-battle-for-the-green-kit:
      cite:
        - ref: "https://cardonapinball.com/shop/ols/products/no-good-gofers-battle-for-the-green-upgrade-kit"
          locator: in the page's meta description
          quote: "Includes everything you need to install No Good Gofers: Battle For The Green into a No Good Gofers Pinball machine. [...] Cardona Pinball Designs is licensed by Planetary Pinball Supply to create 2.0 game kits for Bally-Williams titles"
      model_relationship:
        - target_machine: no-good-gofers
          relationship_type: conversion_kit
          license_status: licensed
  - model.no-good-gofers-battle-for-the-green-kit:
      note: "The industrial 15.6-inch monitor in the kit's replacement speaker panel is an LCD-class display."
      cite:
        ref: "https://cardonapinball.com/shop/ols/products/no-good-gofers-battle-for-the-green-upgrade-kit"
        locator: in the page's meta description
        quote: 'Speaker panel with (2) 4" speakers, a industrial 15.6 inch monitor, and associated cabling.'
      display_type: lcd
  - model.no-good-gofers-battle-for-the-green-kit:
      note: "The FAST platform is a computerized game system, so the solid-state generation follows."
      cite:
        - ref: "https://img1.wsimg.com/blobby/go/4bd466e8-edb0-49f6-afcc-31250ba5b0f3/downloads/b8901727-49fa-4784-801d-6663cfa49dd1/NGG%20rev%20changes%202025%2006%2001.pdf"
          locator: PDF document page 1
          quote: "tested with FAST firmware 2.1, mpf 0.56 dev 20"
        - ref: "https://cardonapinball.com/shop/ols/products/no-good-gofers-battle-for-the-green-upgrade-kit"
          locator: in the page's meta description
          quote: "FAST Interface controller board (to be installed in the removed CPU location). CPU panel that includes CPU, FAST audio and accessory controller, and associated cabling (to be installed in the removed audio/video board location)."
      technology_generation: solid-state
      system: fast-pinball
  - model.no-good-gofers-battle-for-the-green-kit:
      cite:
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "He writes the code, designs the games, and has brought in more professional artists and voice actors with each title, while FAST Pinball handles the hardware."
        - ref: "https://www.kineticist.com/news/james-cardona-interview"
          quote: "I had only written No Good Gofers: Battle For The Green and developed the game for P-Roc hardware."
      credit:
        - james-cardona: design
        - james-cardona: software
  - model.no-good-gofers-battle-for-the-green-kit:
      cite:
        ref: "https://cardonapinball.com/shop/ols/products/no-good-gofers-battle-for-the-green-upgrade-kit"
        locator: in the page's meta description
        quote: "Cart Smash - multiball mode started by enough gopher or cart hits, shoot cart or TNT"
      gameplay_feature: [multiball]
