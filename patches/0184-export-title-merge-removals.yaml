attribution: flipcommons-catalog
description: Hand over the freed title slugs and retire the emptied titles.
claims:
  # ---- Slug handover: each surviving title takes the plain slug the emptied
  #      title gave up when it was reslugged out of the way. A patch cannot
  #      both free a slug and claim it, so the claim lands here.
  - title.cavalier-2:
      note: >
        The surviving Cavalier title, now holding both the Petaco original
        and Recel's export edition. Takes the plain cavalier slug, freed
        when the emptied title was reslugged out of the way; it replaces the
        placeholder minted when the two sat in separate titles.
      slug: cavalier
