  - model.pokemon-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: Hit Pokédex captive ball to scan Pokémon; Town themed right scoop starts Rival Battles and other features; Complete B-A-T-T-L-E targets to advance in game and start Team Rocket Multiball; Bulbasaur outer left orbit leads to the back ramp and returns the ball to the right flipper; Right ramp encircles Pikachu toy to advance to Pikachu multiball. Feeds wire ramp back to right flipper; Charmander optical spinning target enters Tall Grass themed pop bumper area of playfield where players can discover Pokémon; 2 flippers; 2 lit pop bumpers; Full-spectrum RGB LED playfield arrow inserts"
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/02/PANTS-Matrix-added-%C2%A9_021226.pdf"
        locator: PDF document page 1
      gameplay_feature:
        [
          captive-ball,
          scoops,
          targets,
          multiball,
          orbits,
          ramps,
          optical-spinners,
          { flippers: 2 },
          { pop-bumpers: 2 },
          rgb-playfield-inserts,
        ]
  - model.pokemon-pro:
      cite:
        - ref: "https://www.sternpinball.com/2026/02/13/become-a-top-pokemon-trainer-with-stern-pinballs-newest-line-of-machines"
          quote: The interactive Meowth Balloon toy swoops down onto the battle arena to challenge the Trainer.
        - ref: "https://www.kineticist.com/news/stern-pinball-reveals-pokemon-pinball"
          quote: "An interactive Meowth Balloon descends to the playfield arena during battle sequences — Team Rocket's signature Meowth as a physical target to bash."
      gameplay_feature: [bash-toys]
  - model.pokemon-pro:
      cite:
        ref: "https://www.sternpinball.com/2026/02/13/become-a-top-pokemon-trainer-with-stern-pinballs-newest-line-of-machines"
        quote: "Bringing the experience to life even further, custom voiceovers for Pikachu and the notorious Team Rocket leader, Giovanni, captures the spirit and humor that fans know and love."
      gameplay_feature: [speech]
  - model.pokemon-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: Powder-coated black wrinkle finish hand guard side armor, hinges, front lockdown molding and legs; Multifunction Action Button on lockdown bar"
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/02/PANTS-Matrix-added-%C2%A9_021226.pdf"
        locator: PDF document page 1
      gameplay_feature: [side-armor, lockdown-bar-buttons]
  - model.pokemon-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: 6 pinballs; Stereo sound system with 3-channel amplifier"
