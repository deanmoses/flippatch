          quote: Pikachu static toy with custom recorded speech.
        - ref: "https://www.sternpinball.com/game/pokemon/pro"
          quote: "RGB illuminated static Poké Ball includes ball stop post on left ramp."
      gameplay_feature: [static-toys]
