        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/02/PANTS-Matrix-added-%C2%A9_021226.pdf"
        locator: PDF document page 1
      gameplay_feature: [{ balls: 6 }, stereo-sound]
  - model.pokemon-pro:
