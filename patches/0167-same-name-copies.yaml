attribution: flipcommons-catalog
description: Same-name copy lineage — slug rename + title merge for six cross-maker copies.
claims:
  # ---- Already co-titled with the original: slug rename only, no title move.
  - model.spanish-eyes-2:
      # Already shares the spanish-eyes title with the Williams original, so no
      # title move is needed; only the slug rename.
      slug: spanish-eyes-segasa
      cite:
        ref: ipdb:3265
        quote: "This game is a near copy of Williams' 1971 'Spanish Eyes', with different cabinet colors, different playfield plastics, and a different backglass."
      model_relationship:
        - target_machine: spanish-eyes
          relationship_type: copy
          license_status: unknown
  - model.totem-3:
      # Already shares the totem title with the Gottlieb original, so no title
      # move is needed; only the slug rename.
      slug: totem-electromatic-brasil
