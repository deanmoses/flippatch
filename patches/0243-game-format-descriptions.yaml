          quote: "According to Genco data, 245 units of this rolldown game were made. Production start date: 01/31/48 Production end date: 02/19/48"
        "19":
          ref: http://www.pinrepair.com/arcade/numroll.htm
          quote: 'Number Roll, Genco, 6/57, two player, a rolldown game where the player is trying to get "21" in each of the four frames. [...] This roll down game largely mimics the game of black jack.'
        "20":
