          locator: p. 70
        "8":
          ref: ipdb:3269
          quote: "Production: 4518 [...] Production start date: 10/30/45"
        "9":
          ref: ipdb:2374
          quote: "Genco advertised this game as their first post-war 5-ball pinball machine and, while that is accurate, it was actually their fourth post-war effort, following their rolldown game Total Roll and two vertical counter games Whizz and Pee-Wee."
        "11":
