          quote: "Though the game makes no reference to dice, it's apparent that the game does follow a dice style game."
        "21":
          ref: http://www.pinrepair.com/arcade/lucky7.htm
          quote: "The thing that makes this roll down game unique is the player nudge buttons. [...] With a bit of practice this gives the game a great deal of skill, allowing the player to nudge to the point hole desired."
