        "14":
          ref: billboard:1946-07-06
          locator: p. 161
        "15":
          ref: https://en.wikipedia.org/wiki/Humpty_Dumpty_(pinball)
          quote: "By the end of 1947 every pinball manufacturer had either produced or started to develop their own pinball machines with flippers."
        "16":
          ref: ipdb:1567
          quote: "'Melody' was the first flipper machine manufactured by Bally. The rolldown version of this game is Bally's 1947 'Melody Roll'."
        "17":
          ref: ipdb:2800
          quote: "'Wisconsin' was the first flipper game made by United. Pictured in this listing is a game that appears to have been converted not once, but twice, by an operator."
        "18":
