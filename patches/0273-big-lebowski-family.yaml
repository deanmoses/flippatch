attribution: flipcommons-catalog
description: >
  The Big Lebowski: one title for all three models, and the older two filled in.
claims:
  - model.the-big-lebowski-pinball-second-model:
      cite:
        - ref: "ipdb:6833"
          quote: This is a revised edition of their original model
        - ref: "ipdb:6833"
          quote: Cosmetically nothing changed
      title: the-big-lebowski
  - model.the-big-lebowski-pinball-first-model:
      cite:
        - ref: "ipdb:6320"
          quote: The manufacturer advised us that the first shipment of this game occurred April 2016.
        - ref: "ipdb:6320"
          quote: The manufacturer made a quantity of 95 of this First Model.
      production_status: produced
  - model.the-big-lebowski-pinball-first-model:
      cite:
        ref: "https://cms.dutchpinball.com/uploads/Dutch_Pinball_2021_The_Big_Lebowski_Pinball_Manual_1_12_f7ce352aaa.pdf"
        locator: "printed page 12, PDF document page 12, in the GAME SETUP INSTRUCTION section"
        quote: A pinball machine is an extremely heavy machine and not setting it up correctly may result in injuries.
      game_format: pinball
  - model.the-big-lebowski-pinball-first-model:
      note: "The floor classification follows from the manual's own setup: a free-standing machine on four levelled legs with a backbox raised at the rear."
      cite:
        - ref: "https://cms.dutchpinball.com/uploads/Dutch_Pinball_2021_The_Big_Lebowski_Pinball_Manual_1_12_f7ce352aaa.pdf"
          locator: "printed page 12, PDF document page 12, in the GAME SETUP INSTRUCTION section"
          quote: "4 Pinball legs [...] 4 Pinball Leg levelers with tightening nuts [...] 8 Leg bolts"
        - ref: "https://cms.dutchpinball.com/uploads/Dutch_Pinball_2021_The_Big_Lebowski_Pinball_Manual_1_12_f7ce352aaa.pdf"
          locator: "printed page 17, PDF document page 17, at STEP 12"
          quote: Lift the backbox in its upright position.
      cabinet: floor
  - model.the-big-lebowski-pinball-first-model:
      cite:
        ref: "ipdb:6320"
        quote: Playfield - all lamps are LED. Cabinet - all lamps are LED.
      gameplay_feature: [led-general-illumination]
  - model.the-big-lebowski-pinball-second-model:
      cite:
        - ref: "ipdb:6833"
          quote: first shipped in August 2019
        - ref: "https://dutchpinball.com/games/the-big-lebowski"
          locator: in the availability badge
          quote: Sold out
      production_status: produced
  - model.the-big-lebowski-pinball-second-model:
