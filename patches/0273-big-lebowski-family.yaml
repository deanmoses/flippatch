        locator: "printed page 55, PDF document page 55, in the DISPLAY section"
        quote: "TBL's with the new style LCD display (recognizable due to being higher as the speakerpanel) will have a setting of 100, previous TBL will have a setting of 0."
      display_type: lcd
  - model.the-big-lebowski-pinball-second-model:
      cite:
        ref: "ipdb:6833"
        quote: 'This game is based on the 1998 movie "The Big Lebowski" and features characters and events from this movie.'
      theme: [movies]
  - model.the-big-lebowski-pinball-second-model:
      note: "The second model is the first re-issued unchanged in the cabinet and on the playfield, so the first model's illumination is a fact about it too."
