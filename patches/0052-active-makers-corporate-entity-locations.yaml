attribution: flipcommons-catalog
description: >
  Assign headquarters cities to the active makers' entities.
claims:
  - corporate-entity.wonderland-amusements:
      expect: { name: Wonderland Amusements }
      note: "The legal address is the West Berlin, NJ home of CEO Jerry Cummings' ThinkUp."
      cite:
        ref: https://b2bhint.com/en/company/us-ca/wonderland-amusements-llc--B20250303120
        quote: "Legal address [...] 134 HADDON AVE, WEST BERLIN, NJ, 08091"
      location: [usa/nj/west-berlin]
  - corporate-entity.pawlowski-pinball:
      expect: { name: Pawlowski Pinball }
      cite:
        ref: https://bisprofiles.com/fl/pawlowski-pinball-l21000070173
        quote: "PAWLOWSKI PINBALL LLC is an Active company [...] is located at 186 BLUE FLAX PT, LONGWOOD, FL, 32750, US"
      location: [usa/fl/longwood]
  - corporate-entity.ramps-pinball:
      expect: { name: "Ramp's Pinball" }
      cite:
        ref: https://www.rampspinball.com/contact
        quote: "Made In [...] Odessa, FL"
      location: [usa/fl/odessa]
  - corporate-entity.euro-pinball-corp:
      expect: { name: Euro Pinball Corp }
      cite:
        ref: https://www.europinball.net/contact
        quote: "Euro Pinball Corp. S.R.L. [...] Via Martin Luther King, 3 [...] 24060 Bagnatica (BG) ITALY"
      location: [italy/bg/bagnatica]
