          quote: "Stern Spike Shaker Motor Kit for the SPIKE system games. Make sure your game is a Spike game, before you purchase this motor."
        "5":
          ref: "https://jerseyjackpinball.com/collections/sonic-the-hedgehog-pinball-game"
          quote: "SHAKER MOTOR WITH HAPTIC FEEDBACK (CE & SE ONLY) [...] From loop ramps to boss battles, the shaker motor delivers physical feedback that puts you in the action. Available on the Collector's and Special Editions"
  - gameplay-feature.magic-squares:
      description: |
        Magic Squares is a backglass mechanism of [[manufacturer:bally]]'s [[game-format:bingo-pinball]] machines: blocks of four numbers on the game's [[gameplay-feature:bingo-cards]] are mounted on wheels behind the glass, and buttons on the cabinet's foot rail turn each block a quarter-turn at a time, rearranging the card itself.[[cite:1]] A ball already resting in a numbered hole stays put while the card moves around it, so a player can rotate a near miss into a paying line after the shooting is done.[[cite:1]] The squares sat in the corners of the card at first, and players took to calling the feature "turning corners".[[cite:2]]

        ## Origins

        The first Magic Squares game was *[[title:broadway-3]]* (1955, Bally).[[cite:3]][[cite:4]] Like most things on a bingo, the rotation ran on money: whether the buttons worked at all, and how deep into the game they stayed live, were features the player bought with additional coins.[[cite:5]][[cite:6]]

        ## The arms race

        Magic Squares was one round in an arms race — through the 1950s Bally's bingos grew steadily more elaborate, each new machine adding another way to work the card.[[cite:7]] It followed the moving numbers of [[gameplay-feature:magic-lines]], introduced on *[[title:variety-2]]* (1954),[[cite:8]] and was answered in turn by the [[gameplay-feature:magic-screen]] in 1958 and [[gameplay-feature:mystic-lines]] in 1965. The wheels earned their keep for two decades — Bally was still building Magic Squares games as late as *[[title:bonanza-4]]* (1976).
      cites:
        "1":
          ref: "https://bingo.cdyn.com/machines/bally/broadway"
          quote: "Some of the numbers on the bingo card are are mounted on wheels (behind the backglass), and pushing buttons on the foot rail allows you to rotate the wheels to rearrange the numbers into paying combinations."
        "2":
