        "4":
          ref: "https://bingo.cdyn.com/machines/bally/broadway"
          quote: "Broadway introduced a new form of rearranging numbers which turned out to be very popular - Magic Squares."
        "5":
          ref: ipdb:382
          quote: "Player can press buttons to rearrange numbers on card in backglass if these features are purchased"
        "6":
          ref: "https://www.kineticist.com/news/a-beginners-guide-to-bingo-pinball"
          quote: "During this phase, the player drops one or more coins in an attempt to earn increased odds or feature awards."
