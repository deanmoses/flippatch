  - model.dungeon-crawler-carl:
      note: "The wireforms are habitrails (wire ball guides)."
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/27/dungeon-crawler-carl-revealed/"
        quote: "there is a left orbit lane which goes all the way around the back and exits into the right orbit lane. [...] The left ramp feeds onto a wireform which runs down the right side of the playfield, onto the clear plastic ball guide and into the right inlane. [...] In the very centre is a Safe Room scoop with an upkicker which is protected by a drop target and flanked by standup targets. [...] The centre right lane is a shallow ramp with a diverter"
      gameplay_feature:
        [
          orbits,
          ramps,
          habitrails,
          scoops,
          vertical-up-kickers,
          solitary-drop-targets,
          standup-targets,
          ramp-diverters,
        ]
  - model.dungeon-crawler-carl:
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/27/dungeon-crawler-carl-revealed/"
        quote: "a cannon which can be loaded and fired at playfield-level shots [...] both inlanes now incorporate blockers which can be used to lock and release balls. [...] This magnet can grab the ball when certain features, such as the boss battles, begin. [...] six round standup targets with a central player-controlled disruptor magnet [...] the Mongo Cage can also act as a captive ball, or it can become a ball lock when building towards multiball"
      gameplay_feature:
        [ball-cannons, ball-locks, magnets, captive-ball, multiball]
  - model.dungeon-crawler-carl:
      note: "The character sculpts state no motion or ball interaction, so they classify as static toys."
      cite:
        ref: "https://www.pinballnews.com/site/2026/07/27/dungeon-crawler-carl-revealed/"
        quote: "There are four character sculpts – Carl, Samantha, Donut and Mongo, along with a giant sculpt for the dungeon."
      gameplay_feature: [static-toys]
