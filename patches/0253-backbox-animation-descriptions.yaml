  - gameplay-feature.backbox-light-animations:
      description: |
        Backbox light animations are [[gameplay-feature:backbox-animations]] drawn in light rather than machinery: lamps banked behind the [[gameplay-feature:backglasses]] flash in sequence, making the figures painted on the glass appear to move.

        The effect predates [[gameplay-feature:flippers]]: lamps carry racing cars around a track on the glass of *[[title:motordrome]]* (1936, [[manufacturer:o-d-jennings-and-company]]).[[cite:1]] [[manufacturer:gottlieb]] took it into the flipper age at the very start — *[[title:humpty-dumpty]]* (1947) animates its namesake's fall in stop-motion light,[[cite:2]] and the fairy-tale series it opened ran to seven games, every one carrying a backglass animation.[[cite:3]][[cite:4]]

        Where a [[gameplay-feature:mechanical-backbox-animations]] unit turns real wheels, the light show is wiring alone, and it kept a place on the backglass long after scores moved to electronic displays: Gottlieb's *[[title:silver-slugger]]* (1990) and [[manufacturer:stern-pinball]]'s *[[title:high-roller-casino]]* (2001) both sequence backglass lamps beside their score displays.
      cites:
        "1":
          ref: ipdb:1632
          quote: "Backglass light animation (cars move around track)."
        "2":
          ref: ipdb:1254
          quote: "Backglass stop-motion light animation (Humpty Dumpty falls)."
        "3":
          ref: https://en.wikipedia.org/wiki/Humpty_Dumpty_(pinball)
          quote: "The game is the first in a series of seven Fairy Tale games"
        "4":
          ref: https://en.wikipedia.org/wiki/Humpty_Dumpty_(pinball)
          quote: "all of which include an backglass animation"
