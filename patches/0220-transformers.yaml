  - system.stern-spike-3:
      create: true
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
        quote: This one-of-a-kind pinball experience is powered by Stern's next-generation technology with the new SPIKE 3 platform.
      name: Stern SPIKE 3
      manufacturer: stern-pinball
      technology_subgeneration: ss-pc
  - person.elizabeth-gieske:
      create: true
      note: "Lead software developer on Transformers: More Than Meets the Eye, her first credit here. Spelling per Kineticist and Arcade Heroes; the reveal video's auto-captions render it 'Geski'."
      cite:
        ref: "https://www.kineticist.com/news/stern-transformers-reveal"
        locator: in the Design Team section
        quote: "Lead Programmer: Elizabeth Gieske"
      name: Elizabeth Gieske
  - model.transformers-more-than-meets-the-eye-pro:
      cite:
        - ref: "https://www.sternpinball.com/2026/05/20/roll-out-for-battle-with-transformers-more-than-meets-the-eye-by-stern-pinball"
          quote: "TRANSFORMERS: More Than Meets the Eye by Stern Pinball is available now in Pro, Premium, and Limited Edition (LE) models."
        - ref: "https://www.sternpinball.com/2026/08/04/stern-of-the-union-address-august-2026"
          quote: "TRANSFORMERS: More Than Meets The Eye pinball machines are rolling out worldwide"
      production_status: produced
  - model.transformers-more-than-meets-the-eye-pro:
      cite:
        ref: "https://www.sternpinball.com/2026/05/20/roll-out-for-battle-with-transformers-more-than-meets-the-eye-by-stern-pinball"
        quote: revealed and released a new adrenaline-fueled pinball experience
      game_format: pinball
  - model.transformers-more-than-meets-the-eye-pro:
      note: "SPIKE 3 is Stern's computerized game platform, so the solid-state generation follows. The matrix row is checked in all three edition columns, including PRO."
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
        quote: This one-of-a-kind pinball experience is powered by Stern's next-generation technology with the new SPIKE 3 platform.
      technology_generation: solid-state
      system: stern-spike-3
  - model.transformers-more-than-meets-the-eye-pro:
      note: 'On the feature matrix sheet, the PRO column carries a checkmark for the rows: Custom animations on larger, 18.5" full HD display'
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
      display_type: lcd
  - model.transformers-more-than-meets-the-eye-pro:
      note: "The reveal video's auto-captions misspell both names ('Eisman', 'Geski'); the quote is verbatim ASR. The spellings Eismin and Gieske follow the feature matrix ('Game Designer Elliot Eismin') and the Kineticist and Arcade Heroes coverage."
      cite:
        - ref: "youtube:zLx93Iiy5yw"
          quote: "Hi, I'm Elliot Eisman, lead game designer for Transformers more than meets the eye. [...] Hi, I'm Elizabeth Geski, lead software [...] developer for Transformers: More Than Meets the Eye."
        - ref: "https://www.kineticist.com/news/stern-transformers-reveal"
          locator: in the Design Team section
          quote: "Design: Elliot Eismin [...] Lead Programmer: Elizabeth Gieske"
      credit:
        - elliot-eismin: design
        - elizabeth-gieske: software
  - model.transformers-more-than-meets-the-eye-pro:
      note: "Kineticist's Design Team block is the only non-crowdsourced source naming these four; corroborating first-party sources were sought at authoring time and none found (the manual carries no credits). 'Lead LCD Artist' maps to the animation role and 'Audio' to sound."
      cite:
        ref: "https://www.kineticist.com/news/stern-transformers-reveal"
        locator: in the Design Team section
        quote: "Lead Mechanical: Rob Blakeman [...] Code: Mike Kyzivat [...] Audio: Jerry Thompson [...] Lead LCD Artist: Tom Kyzivat"
      credit:
        - rob-blakeman: mechanics
        - mike-kyzivat: software
        - jerry-thompson: sound
        - tom-kyzivat: animation
  - model.transformers-more-than-meets-the-eye-pro:
      note: 'On the feature matrix sheet, the PRO column carries a checkmark for the rows: Custom sculpted Optimus Prime robot bash toy; Optimus Prime V.U.K. (leads to Soundwave for ball locks, starts Transformers Multiball); Energon optical spinner; Right Ramp With Laser Cut Decepticon Logo; 3 Bank Drop Targets; Complete Grimlock targets; Left Ramp With Laser Cut Autobot Logo; Bumblebee Captive Ball; Physical "Add a Ball" Ball Lock Post; 3 Flippers (2 Standard + 1 Upper Flipper); 2 Slingshots (2 Lower + 1 Upper Left); Full-spectrum RGB LED playfield arrow inserts The slingshot row''s headline count (2) and its own enumeration (2 Lower + 1 Upper Left) disagree, so slingshots attach without a count; the flipper row appears twice on the sheet and attaches once.'
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
      gameplay_feature:
        [
          bash-toys,
          vertical-up-kickers,
          multiball,
          ball-locks,
          up-posts,
          optical-spinners,
          ramps,
          3-bank-drop-targets,
          targets,
          captive-ball,
          { flippers: 3 },
          slingshots,
          rgb-playfield-inserts,
        ]
  - model.transformers-more-than-meets-the-eye-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: Powder-coated black wrinkle finish hand guard side armor, hinges, front lockdown molding and legs; Multifunction Action Button on lockdown bar"
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
      gameplay_feature: [side-armor, lockdown-bar-buttons]
  - model.transformers-more-than-meets-the-eye-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: 6 pinballs; Stereo sound system with 3-channel amplifier"
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
        locator: "PDF document page 1 of 1; the sheet carries no printed folio"
      gameplay_feature: [{ balls: 6 }, stereo-sound]
  - model.transformers-more-than-meets-the-eye-pro:
      cite:
        ref: "https://www.sternpinball.com/2026/05/20/roll-out-for-battle-with-transformers-more-than-meets-the-eye-by-stern-pinball"
        quote: "for the first time, includes a head-to-head experience that allows two players to compete simultaneously in real time"
      gameplay_feature: [head-to-head]
  - model.transformers-more-than-meets-the-eye-pro:
      note: "On the feature matrix sheet, the PRO column carries a checkmark for the rows: Static Megatron robot toy starts missions featuring specific episodes from the TV series with custom recorded speech by Frank Welker Static is Stern's own word for this edition's Megatron, so it classifies as a static toy."
      cite:
        ref: "https://wp.sternpinball.com/wp-content/uploads/2026/05/Transformers-More-Than-Meets-the-Eye-Feature-Matrix.pdf"
