attribution: flipcommons-catalog
description: LTD do Brasil copy lineage — unlicensed copies of Bally/Gottlieb designs.
claims:
  # ==========================================================================
  # LTD do Brasil (LTD do Brasil Diversões Eletrônicas Ltda), of Campinas, São
  # Paulo, Brazil, 1977-1984. Under Brazil's Reserva de Mercado — the military
  # government's market-reserve policy that walled off most electronics imports
  # — LTD built copies of foreign pinball designs for the domestic market. Each
  # entry adds a copy relationship (relationship_type: copy) to the seeded LTD
  # model, with license_status: unlicensed (sourced — see below).
  #
  # All five are RENAMED copies: each carries a name distinct from the original
  # it reproduces (Al Capone ← Speakeasy, Haunted Hotel ← Haunted House, Zephy ←
  # Xenon, Cowboy Eight Ball / Cowboy Eight Ball 2 ← Eight Ball Deluxe, the
  # 3- and 4-player versions of the same LTD copy). Per the campaign slug/naming
  # convention a renamed copy keeps its own slug, title, and name — only the
  # copy relationship is added. So there is no same-name slug rename, no
  # "(Maker)" suffixing, no title merge, and no companion title-removal patch
  # here. (Zephy is already seeded inside the Xenon title — OPDB likewise groups
  # it as a Xenon variant, G42Pk-MZe2e-A976b — and, being a renamed copy, that
  # title placement is left exactly as-is.)
  #
  # --------------------------------------------------------------------------
  # Classification note — license_status: unlicensed (research 2026-07-13)
  #
  # These are recorded as relationship_type: copy + license_status: unlicensed
  # (= UNAUTHORIZED copy). The two citations on each row — both attached to the
  # one changelist — support that TOGETHER; neither alone is sufficient:
  #   - the IPDB note establishes the machine is a COPY of a specific Bally or
  #     Gottlieb game (the copy target): "a copy of ...";
  #   - Augusto Campos's original-research history of the Brazilian trade, "A
  #     curiosa história da Taito no Brasil" (augustocampos.net/taito-brasil),
  #     establishes the copying was UNAUTHORIZED — LTD, "sediada em Campinas",
  #     used the Reserva de Mercado "como escudo para copiar impunemente" the
  #     technology and gameplay of foreign pinballs. "Copiar impunemente" — to
  #     copy with impunity, shielded by protectionist law — is an explicit
  #     statement of unauthorized copying, not an inference from "copy". This is
  #     why license_status is unlicensed here and unknown for R.M.G. (0148),
  #     whose copies have no such authorization source.
  # Together: an unauthorized (Augusto Campos) copy of a named US game (IPDB) =
  # copy + unlicensed. (Zephy carries a third cite from the same history naming
  # it directly as LTD's copy of Bally's Xenon.)
  #
  # No source on record asserts a Bally/Gottlieb licence for LTD. Unlike Petaco
  # (0145), where one Spanish blog alleged a Gottlieb licence that had to be
  # weighed and rejected, there is no licence claim here to rebut. And IPDB *does*
  # say "under license" where one exists — for VIFICO throughout 0127, and for
  # Taito do Brasil's own 'Meteor' (0127, a documented Brazilian licensed build)
  # — so its silence on a licence for LTD is meaningful. If a period licence
  # document ever surfaces, flip license_status to licensed.
  # ==========================================================================

  - model.al-capone:
      cite:
        - ref: ipdb:5176
          quote: "This game is a copy of Bally's 1982 'Speakeasy'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: speakeasy-2
          relationship_type: copy
          license_status: unlicensed
  - model.haunted-hotel:
      cite:
        - ref: ipdb:5704
          quote: "A copy of Gottlieb's 1982 'Haunted House'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: haunted-house
          relationship_type: copy
          license_status: unlicensed
  - model.zephy:
      cite:
        - ref: ipdb:4592
          quote: "This is a copy of Bally's 1980 'Xenon'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
        - ref: https://augustocampos.net/taito-brasil
          quote: "Exemplo: o pinball Xenon, da Bally, deu origem à máquina Zarza, da Taito brasileira, e à Zephy, da LTD (foto acima)."
      model_relationship:
        - target_machine: xenon
          relationship_type: copy
          license_status: unlicensed
  - model.cowboy-eight-ball:
      cite:
        - ref: ipdb:5132
          quote: "A copy of Bally's 1981 'Eight Ball Deluxe'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: eight-ball-deluxe
          relationship_type: copy
          license_status: unlicensed
  - model.cowboy-eight-ball-2:
      # 4-player sibling of cowboy-eight-ball; both are the same LTD copy of Bally's
      # Eight Ball Deluxe. Not in the mined worklist (a gap), so it was absent from
      # the first pass — added here for completeness, same target/license as its 3-player twin.
      cite:
        - ref: ipdb:5734
          quote: "Both versions are a copy of Bally's 1981 'Eight Ball Deluxe'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: eight-ball-deluxe
          relationship_type: copy
          license_status: unlicensed
