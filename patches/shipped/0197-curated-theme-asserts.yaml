attribution: flipcommons-catalog
description: >
  Add replacement themes before the themes they replace are retired.
claims:
  - theme.licensed:
      note: "Recording 'Licensed Theme' as an alternate name for 'Licensed', which replaces it, so the retired name still finds this theme."
      theme_alias: [Licensed Theme]
  - model.24:
      note: "'Licensed Theme' is another name for a theme that already exists. Adding 'Licensed' ahead of its retirement, so this machine keeps the theme when the old one is detached."
      theme: [licensed]
  - model.abra-ca-dabra:
      note: "'Wizardmagic' is a mangled OPDB keyword: the separator between its two halves was lost during an earlier ingest. Adding 'Magic' ahead of its retirement, so this machine keeps the theme when the old one is detached."
      theme: [magic]
