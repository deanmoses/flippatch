  # ------------------------------------------------------------------------
  # Elettrocoin (Firenze, Italy) — a conversion-kit house; tilt.it's maker
  # page lists its games as "kit for <American game>".
  # ------------------------------------------------------------------------
  - model.good-year:
      cite:
        - ref: ipdb:4071
          quote: "The undated magazine ad shown here indicates that 'Good Year' is a conversion of these games: Williams' 1967 'Lunar Shot' Williams' 1967 'Blast Off' Williams' 1967 'Apollo'"
        - ref: "https://www.tilt.it/flipper_pinball/ipdb/elettronolo"
          quote: "Good Year (kit for Williams' Lunar Shot)"
      note: "IPDB describes 'Good Year' as a conversion of three Williams 1967 games; tilt.it's Elettrocoin maker page lists it (and its siblings) as a 'kit for' those donors, establishing the conversion_kit type. All three named donors are seeded Williams 1967 EM games."
      model_relationship:
        - target_machine: lunar-shot
          relationship_type: conversion_kit
          license_status: unknown
        - target_machine: blast-off
          relationship_type: conversion_kit
          license_status: unknown
        - target_machine: apollo
          relationship_type: conversion_kit
          license_status: unknown
  - model.mexico-3:
      cite:
        - ref: ipdb:4074
          quote: "'Mexico' is a conversion of Bally's 1967 'Rocket III'."
        - ref: "https://www.tilt.it/flipper_pinball/ipdb/elettronolo"
          quote: "Mexico (kit for Bally's Rocket III)"
      note: "Targets rocket-iii-italy, the Add-a-ball version of Bally's 'Rocket III' made for export to Italy, not the US replay original (rocket-iii). Elettrocoin was a Florence kit house, so the donor physically available to convert in Italy was the Italy-market machine — whose reward type had already been changed to add-a-ball for compliance with Italian anti-gambling regulations."
      model_relationship:
        - target_machine: rocket-iii-italy
          relationship_type: conversion_kit
          license_status: unknown
  - model.derby-3:
      cite:
        - ref: ipdb:4075
          quote: "The undated magazine ad shown here indicates that this game is a conversion of Bally's 1966 'Gold Rush'."
        - ref: "https://www.tilt.it/flipper_pinball/ipdb/elettronolo"
          quote: "Derby (kit for Bally's Gold Rush)"
      note: "Targets Bally's 'Gold Rush' Add-a-ball version made for export to Italy (currently slugged gold-rush-6, reslugged gold-rush-italy below), not the US replay original (gold-rush). Elettrocoin was a Florence kit house, so the donor physically available to convert in Italy was the Italy-market machine — whose reward type had already been changed to add-a-ball for compliance with Italian anti-gambling regulations."
      model_relationship:
        - target_machine: gold-rush-6
          relationship_type: conversion_kit
          license_status: unknown
  # gold-rush's Italy-export sibling is still numeric (gold-rush-6); reslug it to
  # gold-rush-italy — market-disambiguated like rocket-iii-italy. The derby-3 edge
  # above targets it by its current slug (target resolution runs against the
  # pre-patch catalog); this rename then follows the model, carrying the edge with
  # it. Model slug only: gold-rush-6 shares the 'gold-rush' title with the US
  # original, so the title and the name are left unchanged.
  - model.gold-rush-6:
      slug: gold-rush-italy
      note: "Disambiguate the slug from Bally's US 'Gold Rush' (gold-rush) by market rather than a numeric suffix, matching rocket-iii-italy. This is the Add-a-ball version (Model 777-A) made for export to Italy."
