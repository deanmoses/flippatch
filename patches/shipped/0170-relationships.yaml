attribution: flipcommons-catalog
description: Model lineage for 30 copies, conversions, and kits across many makers.
claims:
  # ------------------------------------------------------------------------
  # Segasa (Spain)
  # ------------------------------------------------------------------------
  - model.astro-flite:
      cite:
        ref: ipdb:100
        quote: "Copy of Williams' 1974 'Strato-Flite'."
      model_relationship:
        - target_machine: strato-flite
          relationship_type: copy
          license_status: unknown
  - model.high-ace-2:
      cite:
        ref: ipdb:5424
        quote: "Same design as Williams' 1973 'Dealer's Choice'. Same design and coloring as Williams' 1974 'Lucky Ace'. 'High Ace' was made by Segasa under license from Williams."
      note: "Targets are the Williams originals (the catalog's 'dealers-choice' is the Segasa build). IPDB dates Dealer's Choice to 1973; the seeded Williams record (dealers-choice-2) is 1974 — same game, a source-date difference."
      model_relationship:
        - target_machine: dealers-choice-2
          relationship_type: copy
          license_status: licensed
        - target_machine: lucky-ace
          relationship_type: copy
          license_status: licensed
