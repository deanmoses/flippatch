attribution: flipcommons-ai-desc-reward-type
description: >-
  Description for the payout reward type.
claims:
  - reward-type.payout:
      description: |
        A **payout machine** is a machine that dispenses a physical award to the player.[[cite:1]]

        Paying out in coins was common, but also there were things like candy and merchandise.[[cite:2]] The apparatus sat in plain sight on the cabinet. A pull knob on the front of *[[title:les-deux-as]]* drops a winning player's tokens into a cup below,[[cite:3]] and [[manufacturer:a-j-stephens-and-company]] set the same cup into the cabinet front of *[[title:stevo-jackpot]]*.[[cite:4]]

        ## One model, multiple payout types

        A single model could often be ordered with different types of payouts.  [[manufacturer:stoner-manufacturing-company]]'s *[[title:zipper]]* came three ways — "Ticket, cash, or check models were available".[[cite:5]] *[[title:carom]]* was sold both as a coin-paying game and as a ticket vendor.[[cite:7]]

        ## How it differs from ticket payout

        Whereas a **payout machine** dispenses the actual prize, a [[reward-type:ticket-payout]] machine dispenses a ticket which is then redeemed for a prize.

        ## How it differs from merchant-paid

        Whereas a **payout machine** dispenses the prize itself, a [[reward-type:merchant-paid]] machine displays the fact that the player has won, and the storekeeper hands over the prize.

        ## Coins, and the law that followed them

        [[manufacturer:bally]] released the first pinball machine to pay out on its own, *[[title:rocket-3]]*, in 1933,[[cite:8]] and the coin-paying games that followed drew the regulation that shaped the rest of the century: the delivery of rewards "via cash payouts or prizes" was one of the two grounds on which pinball was classed as gambling.[[cite:9]] The coin-paying machines were eventually classed as gambling devices and banned in most states,[[cite:10]] and the trade answered by changing what came out of the chute rather than giving up the mechanism: tokens took the place of coins, and the machines accepted them back.[[cite:11]] The other answer was to make the award worthless away from the machine — the [[reward-type:replay]] — and that is the one the industry kept.

        Payout survived where the law allowed it. [[manufacturer:keeney]] was still building upright payout games for export in the 1960s,[[cite:12]] the decade American law narrowed its aim to payout machines specifically.[[cite:13]] Some late examples hedged, letting the operator decide whether a win paid cash or added credits.[[cite:14]]
