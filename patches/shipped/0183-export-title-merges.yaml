attribution: flipcommons-catalog
description: Merge the split titles of export editions onto their originals' titles.
claims:
  # ---------------------------------------------------------------------------
  # Each pair below is already joined by an export_edition_of edge — the claim
  # that the two records are one game — yet each model still sits alone in its
  # own title. The edge decided the title placement, so nothing here needs new
  # source research: the export edition is re-homed onto the original's title
  # and the emptied title is retired in the next patch (a soft-delete refuses
  # while a referrer is still attached, and the referrer check reads live DB
  # state, so the re-home cannot share a patch with the delete).
  #
  # Most pairs are Recel/Petaco: one Spanish operation running an export brand
  # (Recel) and a domestic one (Petaco). The domestic original's title survives.
  #
  # Where the doomed title holds the plain slug and the survivor holds a bare
  # numeric placeholder, the slug is handed over: a soft-delete does not
  # release a slug, so the doomed title is reslugged out of the way here and
  # the survivor claims the freed slug in a later patch (one patch cannot both
  # free a slug and claim it). Pairs whose survivor already holds a good slug,
  # or whose plain slug belongs to an unrelated live title, get only the
  # re-home.
  # ---------------------------------------------------------------------------

  # ---- Cavalier (Recel 1979 → Petaco 1979)
  - model.cavalier:
      note: >
        Recorded as the export edition of Petaco's Cavalier, so the two records
        are one game; re-homed from its own single-model title onto the
        original's title.
      title: cavalier-2
  - title.cavalier:
      note: >
        Reslugged to free the cavalier slug for the surviving Cavalier title,
        which claims it in a later patch. This title held only Recel's export edition, now
        re-homed onto the original's title, and is retired next.
      slug: cavalier-duplicate

