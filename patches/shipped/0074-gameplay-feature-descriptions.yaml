attribution: flipcommons-ai-desc-gameplay-feature
description: >
  Narrative descriptions for gameplay features.
claims:
  - gameplay-feature.orbits:
      description: |
        Curved [[gameplay-feature:lanes]] that send the ball in a sweeping loop around the upper playfield, typically hugging the top arch before feeding back to the [[gameplay-feature:flippers]], [[gameplay-feature:inlanes]], or another shot; a full orbit carries the ball all the way around, while a half orbit diverts it partway across. Often fed through a [[gameplay-feature:spinners]] at the lane mouth, orbits reward smooth, powerful shots and form the backbone of the flowing "fan layout" designs epitomized by [[person:brian-eddy]]'s *[[title:attack-from-mars]]* (1995, [[manufacturer:bally]]) and *[[title:medieval-madness]]* (1997, [[manufacturer:williams]]). Unlike [[gameplay-feature:ramps]], which lift the ball above the playfield, an orbit stays at playfield level and curves around its edge, making it a natural building block for loop combos and continuous flow.
  - gameplay-feature.auto-launch:
      description: |
        A solenoid-driven [[gameplay-feature:kickers]] mechanism in  [[gameplay-feature:shooter-lanes]] that fires the ball into play at the press of a button, replacing the manual spring [[gameplay-feature:plungers]]. Because the machine itself controls the launch, it can re-serve balls automatically — feeding the shooter lane during [[gameplay-feature:multiball]], relaunching after a [[gameplay-feature:ball-save]], or firing on a timer — and can stage a button-press [[gameplay-feature:skill-shot]] in place of a measured plunge. Auto-launchers spread across the [[display-type:dot-matrix]] era on [[manufacturer:williams]] and [[manufacturer:bally]] machines and are now near-universal on modern [[manufacturer:stern-pinball]] games such as *[[title:godzilla]]* (2021).
  - gameplay-feature.lanes:
      description: |
        The playfield's guided channels — narrow tracks, usually bounded by plastic or metal rails, that carry the ball along a fixed path rather than letting it roll freely across the open field. The category spans the [[gameplay-feature:outlanes]] and [[gameplay-feature:inlanes]] flanking the [[gameplay-feature:flippers]], the [[gameplay-feature:top-lanes]] crossing the upper playfield, the [[gameplay-feature:shooter-lanes]] that launches the ball into play, and the sweeping [[gameplay-feature:orbits]] that loop around the upper playfield, as well as specialized variants like [[gameplay-feature:kicker-lanes]], [[gameplay-feature:horseshoe-lanes]] and [[gameplay-feature:flex-save-lanes]].

        Lanes have been a standard building block of pinball playfields since the format's earliest days and appear on the overwhelming majority of machines regardless of era or manufacturer, so common that this catalog mostly does not track which machines have them.
  - gameplay-feature.outlanes:
      description: |
        The outermost of the paired [[gameplay-feature:lanes]] flanking the [[gameplay-feature:flippers]] at the bottom of the playfield, running along the cabinet's edges outside the [[gameplay-feature:inlanes]]. A ball that enters an outlane bypasses the flippers entirely and drains without a save opportunity, making outlanes the primary source of unavoidable ball loss; many machines soften this with a [[gameplay-feature:kickback]] or a [[gameplay-feature:ball-save]] rollover positioned partway down the lane.

        Outlanes have been standard equipment on virtually every pinball machine since the format stabilized, so common that this catalog mostly does not track them per machine.
  - gameplay-feature.inlanes:
      description: |
        The inner of the paired [[gameplay-feature:lanes]] flanking the [[gameplay-feature:flippers]], running between the [[gameplay-feature:outlanes]] and the flipper itself and returning the ball to a flipper for a controlled shot instead of draining it. Inlane rollovers commonly light letters, bonuses, or the [[gameplay-feature:skill-shot]], making an inlane the safe counterpart to the same shot landing one lane over in the outlane.

        Like outlanes, inlanes are all but universal across pinball's history and are mostly not tracked per machine in this catalog.
  - gameplay-feature.shooter-lanes:
      description: |
        The dedicated [[gameplay-feature:lanes]] along the cabinet's edge — usually the right side — where the ball is launched into play, whether by a manual spring [[gameplay-feature:plungers]] or a solenoid [[gameplay-feature:auto-launch]]. The lane runs from the ball trough up past the flipper deck to the top of the playfield, where a one-way gate keeps a launched ball from rolling back down it. Some machines route a [[gameplay-feature:skill-shot]] through the shooter lane itself, rewarding a well-timed launch before the ball ever reaches the main playfield.
  - gameplay-feature.top-lanes:
      description: |
        A row of [[gameplay-feature:lanes]] — typically two or three — crossing the upper playfield just below the top arch, separated by standup posts and each carrying its own rollover switch. Common rulesets light letters that spell a bonus word, or advance a value, as the ball crosses each lane; the center lane of a three-lane row is often the hardest to hit square-on and carries the richest award. Unlike the [[gameplay-feature:orbits]] that curve fully around the same area of the playfield, top lanes are straight, gated channels the ball crosses rather than loops through.
