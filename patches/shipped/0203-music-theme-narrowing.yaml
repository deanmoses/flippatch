attribution: flipcommons-catalog
description: >
  Narrow the Music theme to the specific genre on Guns N' Roses and Rush.
claims:
  - model.guns-n-roses-limited-edition:
      note: "Replacing the broad 'Music' theme with 'Hard Rock', which names this game's genre. Guns N' Roses (Collector's Edition) already carries it, and machines sharing a name under one title should agree."
      theme: [hard-rock]
      remove: { theme: [music] }
  - model.guns-n-roses-standard-edition:
      note: "Replacing the broad 'Music' theme with 'Hard Rock', which names this game's genre. Guns N' Roses (Collector's Edition) already carries it, and machines sharing a name under one title should agree."
      theme: [hard-rock]
      remove: { theme: [music] }
  - model.rush-limited-edition:
      note: "Replacing the broad 'Music' theme with 'Rock Music', which names this game's genre. Rush (Premium) already carries it, and machines sharing a name under one title should agree."
      theme: [rock-music]
      remove: { theme: [music] }
  - model.rush-pro:
      note: "Replacing the broad 'Music' theme with 'Rock Music', which names this game's genre. Rush (Premium) already carries it, and machines sharing a name under one title should agree."
      theme: [rock-music]
      remove: { theme: [music] }
