      technology_generation: solid-state
  - model.jim-hensons-labyrinth:
      cite:
        - ref: "https://www.pinballnews.com/site/2023/10/13/labyrinth-revealed"
          quote: 'Behind that backglass is the FAST Pinball boardset which interfaces with the playfield devices, lights and switches, while driving the two 5¼" Kenwood backbox speakers and the JBL 8″ subwoofer in the cabinet base, the backbox LCD panel and, unusually, a 14.9″ second LCD which forms the playfield''s back panel.'
        - ref: "https://pinside.com/pinball/machine/barrels-of-fun-labyrinth"
          locator: in the Game details block's Generation row
          quote: "FAST Pinball"
      system: fast-pinball
  - model.funhouse-remake-collectors-edition:
      note: "The remake's manual lists the FAST Neuron CPU with FAST power-filter and audio boards as the game's circuit boards; a computerized platform, thus solid-state."
      cite:
        - ref: "https://www.pinballremakes.com/wp-content/uploads/2024/07/MANUAL_FH_V2-compresso.pdf"
          locator: "PDF document page 20"
          quote: "FAST Smart Power Filter Board FP-PWR-0007 [...] FAST Neuron PF-CPU-2000-5 [...] FAST Pinball Audio Interface FP-AUD-0100-3"
        - ref: "https://www.pinballremakes.com/wp-content/uploads/2024/07/MANUAL_FH_V2-compresso.pdf"
          locator: "PDF document page 19"
          quote: "Fast Pinball for game circuit bords"
      system: fast-pinball
      technology_generation: solid-state
