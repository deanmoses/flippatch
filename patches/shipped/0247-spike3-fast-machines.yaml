      technology_generation: solid-state
  - model.the-walking-dead-remastered-premium:
      note: "SPIKE 3 is Stern's computerized game platform, thus solid-state."
      cite:
        - ref: "https://www.sternpinball.com/2025/11/04/fight-the-dead-fear-the-living-in-the-walking-dead-remastered-stern-pinballs-newest-pinball-machine"
          quote: "Powered by Stern's new SPIKE 3 technology platform [...] The Walking Dead Remastered pinball game is available now in Premium and Limited Edition (LE) models"
        - ref: "https://pinside.com/pinball/machine/walking-dead-remastered-premium"
          locator: in the Game details block's Generation row
          quote: "Stern SPIKE 3"
      system: stern-spike-3
      technology_generation: solid-state
  - model.the-walking-dead-remastered-limited-edition:
      note: "SPIKE 3 is Stern's computerized game platform, thus solid-state."
      cite:
        - ref: "https://www.sternpinball.com/2025/11/04/fight-the-dead-fear-the-living-in-the-walking-dead-remastered-stern-pinballs-newest-pinball-machine"
          quote: "Powered by Stern's new SPIKE 3 technology platform [...] The Walking Dead Remastered pinball game is available now in Premium and Limited Edition (LE) models"
