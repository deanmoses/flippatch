      note: "The remake's manual lists the FAST Neuron CPU with FAST power-filter and audio boards as the game's circuit boards; a computerized platform, thus solid-state."
      cite:
        - ref: "https://www.pinballremakes.com/wp-content/uploads/2024/07/MANUAL_FH_V2-compresso.pdf"
          locator: "PDF document page 20"
          quote: "FAST Smart Power Filter Board FP-PWR-0007 [...] FAST Neuron PF-CPU-2000-5 [...] FAST Pinball Audio Interface FP-AUD-0100-3"
