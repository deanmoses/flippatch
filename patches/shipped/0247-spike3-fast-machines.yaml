attribution: flipcommons-catalog
description: >-
  Machines on Stern SPIKE 3 and FAST Pinball hardware; FAST founders.
claims:
  - model.star-wars-fall-of-the-empire-pro:
      cite:
        - ref: "https://www.sternpinball.com/2025/09/12/stern-pinball-announces-star-wars-fall-of-the-empire-the-newest-line-of-star-wars-inspired-pinball-machines"
          quote: "Star Wars: Fall of the Empire pinball games are available in Pro, Premium, and Limited Edition (LE) models. [...] The Star Wars: Fall of the Empire pinball games launch on Stern's next-generation SPIKE 3 technology platform"
        - ref: "https://pinside.com/pinball/machine/star-wars-fall-of-the-empire-pro"
          locator: in the Game details block's Generation row
          quote: "Stern SPIKE 3"
      system: stern-spike-3
  - model.star-wars-fall-of-the-empire-premium:
      note: "SPIKE 3 is Stern's computerized game platform, thus solid-state."
      cite:
        ref: "https://www.sternpinball.com/2025/09/12/stern-pinball-announces-star-wars-fall-of-the-empire-the-newest-line-of-star-wars-inspired-pinball-machines"
        quote: "Star Wars: Fall of the Empire pinball games are available in Pro, Premium, and Limited Edition (LE) models. [...] The Star Wars: Fall of the Empire pinball games launch on Stern's next-generation SPIKE 3 technology platform"
      system: stern-spike-3
      technology_generation: solid-state
  - model.star-wars-fall-of-the-empire-limited-edition:
      note: "SPIKE 3 is Stern's computerized game platform, thus solid-state."
      cite:
        ref: "https://www.sternpinball.com/2025/09/12/stern-pinball-announces-star-wars-fall-of-the-empire-the-newest-line-of-star-wars-inspired-pinball-machines"
        quote: "Star Wars: Fall of the Empire pinball games are available in Pro, Premium, and Limited Edition (LE) models. [...] The Star Wars: Fall of the Empire pinball games launch on Stern's next-generation SPIKE 3 technology platform"
