attribution: flipcommons-catalog
description: >
  Conversion lineage for 20 machines, from campaign 0128's parked verdicts.
claims:
  - model.bookmakers:
      cite:
        ref: "ipdb:4397"
        quote: Conversion kit for Bazaar
      model_relationship:
        - target_machine: bazaar-2
          relationship_type: conversion_kit
          license_status: unknown
  - model.coal-town:
      cite:
        ref: "ipdb:5098"
        quote: "This is a backglass conversion of either Bally's 1948 'Citation' or Bally's 1948 'Lexington', depending on if its cabinet has the payout mechanism in it."
