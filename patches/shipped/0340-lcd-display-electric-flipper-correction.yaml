attribution: flipcommons-ai-desc-display-type
description: >
  LCD screen: the flipper that appeared in 1947 was the electric one.
claims:
  - display-type.lcd:
      description: |
        An LCD screen is a flat-panel video display mounted in a machine's backbox, and sometimes on the playfield, in place of a dot-matrix or reel display. The shift to LCD screens brought pinball into the HD era. Where a [[display-subtype:plasma-dmd]] offered 128×32 pixels in a single orange color, a modern LCD backbox display runs at 1920×1080 or higher, capable of playing back video footage, layered animation, and real-time rendered graphics indistinguishable from a console game. [[manufacturer:jersey-jack]]'s *[[title:the-wizard-of-oz]]* (2013) demonstrated what was possible; within a few years, large-format LCD panels had become the industry standard.

        [[manufacturer:stern-pinball]], [[manufacturer:spooky]], [[manufacturer:american-pinball]], and virtually every major manufacturer now ships machines with LCD displays ranging from 15 to 32 inches, often supplemented by secondary LCD panels on the playfield itself. Licensed themes that once required creative dot-matrix animation to suggest their source material can now show actual movie clips, television scenes, and studio-quality art. The backbox has become a full-resolution canvas.

        The transition has not been without debate. Critics argue that high-definition video overwhelms the physical playfield, that the LCD screen's brightness and detail pull the eye away from the ball rather than complementing the action. Advocates counter that the medium should use every available technology, and that the best modern designers integrate display and playfield as a unified experience rather than two competing elements. The argument is ongoing — and entirely appropriate for a medium that has been arguing about its own nature since the electrically operated flipper appeared in 1947.[[cite:1]]
      cites:
        "1":
          ref: https://en.wikipedia.org/wiki/Pinball
          quote: "Gottlieb's Humpty Dumpty, introduced in 1947, was the first game to add electromechanical player-controlled flippers to keep the ball in play longer."
