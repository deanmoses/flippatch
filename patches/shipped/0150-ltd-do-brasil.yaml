attribution: flipcommons-catalog
description: LTD do Brasil copy lineage — unlicensed copies of Bally/Gottlieb designs.
claims:
  - model.al-capone:
      cite:
        - ref: ipdb:5176
          quote: "This game is a copy of Bally's 1982 'Speakeasy'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: speakeasy-2
          relationship_type: copy
          license_status: unlicensed
  - model.haunted-hotel:
      cite:
        - ref: ipdb:5704
          quote: "A copy of Gottlieb's 1982 'Haunted House'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: haunted-house
          relationship_type: copy
          license_status: unlicensed
  - model.zephy:
      cite:
        - ref: ipdb:4592
          quote: "This is a copy of Bally's 1980 'Xenon'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
        - ref: https://augustocampos.net/taito-brasil
          quote: "Exemplo: o pinball Xenon, da Bally, deu origem à máquina Zarza, da Taito brasileira, e à Zephy, da LTD (foto acima)."
      model_relationship:
        - target_machine: xenon
          relationship_type: copy
          license_status: unlicensed
  - model.cowboy-eight-ball:
      cite:
        - ref: ipdb:5132
          quote: "A copy of Bally's 1981 'Eight Ball Deluxe'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: eight-ball-deluxe
          relationship_type: copy
          license_status: unlicensed
  - model.cowboy-eight-ball-2:
      # 4-player sibling of cowboy-eight-ball; both are the same LTD copy of Bally's
      # Eight Ball Deluxe. Not in the mined worklist (a gap), so it was absent from
      # the first pass — added here for completeness, same target/license as its 3-player twin.
      cite:
        - ref: ipdb:5734
          quote: "Both versions are a copy of Bally's 1981 'Eight Ball Deluxe'."
        - ref: https://augustocampos.net/taito-brasil
          quote: "A Taito era a única marca internacional atuando nesse negócio por aqui naquele período, mas certamente não era a única empresa a usar a Reserva de Mercado como escudo para copiar impunemente a tecnologia e a jogabilidade dos pinballs do exterior: a LTD, sediada em Campinas, fazia o mesmo, usando as CPUs 6802 e 6803, da Motorola."
      model_relationship:
        - target_machine: eight-ball-deluxe
          relationship_type: copy
          license_status: unlicensed
