      note: "tilt.it describes a complete conversion installed in a Gottlieb cabinet, with artwork copied from Williams' Flash; the specific Gottlieb donor is not named, and Williams' Flash is only the art source, not the donor."
      cite:
        ref: "https://www.tilt.it/flipper_pinball/ipdb/centralmatic-lombarda"
        quote: 'una copia, almeno nella grafica, dell''elettronico Williams "Flash", strutturata per essere installata in un mobile Gottlieb''s, funzionante elettromeccanicamente'
      model_relationship:
        - target_label: a Gottlieb machine
          relationship_type: conversion
          license_status: unknown
