      player_count: 4
      changesets:
        - note: 'Play mechanisms, flipper count, and game format from IPDB #824''s Notable Features. The six flippers span a main and an "upper transparent" second-level playfield, hence multi-level-playfield; the flipper/bumper/drop-target complement fixes the format as pinball. Drop-target banks: one 3-bank, two 4-bank, one 6-bank.'
          cite:
            ref: ipdb:824
            quote: "Pop bumpers (4). One 3-bank, two 4-bank, and one 6-bank drop targets. Six flippers (two on the main playfield, two on the upper transparent playfield, and two outlane-save flippers)."
          game_format: pinball
          flipper_count: 6
          gameplay_feature:
            - pop-bumpers: 4
            - 3-bank-drop-targets: 1
            - 4-bank-drop-targets: 2
            - 6-bank-drop-targets: 1
            - flippers: 6
            - multi-level-playfield
