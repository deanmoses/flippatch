  - model.combat-3:
      note: "Solid-state 'Combat' prototype (IPDB #6682), distinct from the produced EM 'Combat' (model.combat, IPDB #3609). Presented at the ENADA show in Rome on 12-14 October 1977 and the AMOA Expo in Chicago on 28-30 October 1977; never produced (catalog production status 'Unreleased'). Year is the presentation year from IPDB #6682's Notes; no month is asserted, as a show-presented prototype has no manufacture date (IPDB records no DateOfManufacture)."
      cite:
        ref: ipdb:6682
        quote: "This solid state 'Combat' prototype with a Signetics microprocessor was presented at the 1977 ENADA show in Rome, Italy on October 12-14, 1977"
      year: 1977
      changesets:
        - note: "Display type from IPDB #6682's Notes, which describe a digital display like the ones on Zaccaria's first production solid-state game, the 1978 'Winter Sports' (alphanumeric segmented LEDs)."
          cite:
            ref: ipdb:6682
            quote: "Player 2 display shows the smaller size of the actual digital display, similar to the ones on the Bally's 1974 'Bow and Arrow' prototypes and to the ones ultimately used on Zaccaria's first production solid state game, Zaccaria's 1978 'Winter Sports'."
          display_type: alphanumeric
