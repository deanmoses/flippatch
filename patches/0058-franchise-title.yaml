attribution: flipcommons-catalog
description: >
  Link licensed-property titles to their franchises.
claims:
  - title.teenage-mutant-ninja-turtles-battle-in-the-sewer:
      expect: { name: "Teenage Mutant Ninja Turtles: Battle in the Sewer" }
      franchise: teenage-mutant-ninja-turtles
      cite:
        ref: https://www.retronews.com/tmnt-pinball/
        quote: "A Teenage Mutant Ninja Turtles (TMNT) home pinball machine is now available to pre-order from home Wonderland Amusements"
  - title.little-shop-of-horrors:
      expect: { name: Little Shop of Horrors }
      franchise: little-shop-of-horrors
      cite:
        ref: https://twip.kineticist.com/p/brought-to-you-by-secrets
        quote: "I stumbled upon a trademark filing by TiltBob Pinball for a Little Shop of Horrors machine, which was filed earlier this year."
  - title.ultra-attack:
      expect: { name: "Ultra Attack (ウルトラアタック)" }
      franchise: ultraman
      cite:
        ref: https://earlyarcadesjapan.blogspot.com/2024/03/1972-ultra-attack-by-nihon-gorakuki.html
        quote: "These machines could not exist prior to 1971 as it references characters and images from 帰ってきたウルトラマン / Return of Ultraman, like Ultraman Jack, and the MAT logo (Monster Attack Team)."
  - title.ultra-spark:
      expect: { name: "Ultra Spark (ウルトラスパーク)" }
      franchise: ultraman
      cite:
        ref: https://earlyarcadesjapan.blogspot.com/2024/03/1972-ultra-attack-by-nihon-gorakuki.html
        quote: "These machines could not exist prior to 1971 as it references characters and images from 帰ってきたウルトラマン / Return of Ultraman, like Ultraman Jack, and the MAT logo (Monster Attack Team)."
  - title.american-battle-dome:
      expect: { name: "American Battle Dome (アメリカンバトルゲーム)" }
      franchise: battle-dome
      note: "Japanese Wikipedia: American Battle Dome (アメリカンバトルドーム) originates as a Tsukuda Original flipper-ball toy (1994, rights from Anjar Co.); Sunwise made the 1995 arcade flipper machine. The pinball title is a licensed adaptation of the Battle Dome property."
      cite:
        ref: "https://ja.wikipedia.org/wiki/バトルドーム"
        quote: "アメリカンバトルドーム（アーケードゲーム） [...] サンワイズから1995年11月に発売された。1-4人用。"
