claims:
  - model.fish-tales:
      cite:
        ref: "williams:fish-tales-flyer-1992"
        locator: in the VIDEO MODE panel on the flyer back
        quote: Video Mode allows players to torpedo speeding boats and watercraft in an overcrowded lake.
      gameplay_feature: [video-modes]
  - model.fish-tales:
      note: "Williams-era documents call pop bumpers jet bumpers; the switch matrix names three."
      cite:
        - ref: "williams:fish-tales-operations-manual-1992"
          locator: "in the Switch Matrix, printed page 3-4, PDF document page 98"
          quote: 51 Left Jet 52 Center Jet 53 Right Jet
        - ref: "williams:fish-tales-parts-list-1992"
          quote: jet bumper coil assy-2 pin con
      gameplay_feature: [{ pop-bumpers: 3 }]
  - model.fish-tales:
      note: "Sling is Williams' term for the slingshot kicker."
      cite:
        ref: "williams:fish-tales-operations-manual-1992"
        locator: "in the Switch Matrix, printed page 3-4, PDF document page 98"
        quote: 57 Left Sling 58 Right Sling
      gameplay_feature: [{ slingshots: 2 }]
  - model.fish-tales:
      cite:
        ref: "williams:fish-tales-operations-manual-1992"
        locator: "in Pinball Game Assembly Instructions, printed page 1-2, PDF document page 17"
        quote: 'Cabinet Dimensions Approx. Length: 55"Approx. Width: 26" Approx. Height: 85" Weight: 285 lbs'
      cabinet: floor
