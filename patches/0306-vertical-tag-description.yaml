attribution: flipcommons-ai-desc-tag
description: >
  Description for the vertical tag.
claims:
  - tag.vertical:
      description: |
        A vertical machine is one whose playfield stands upright behind the glass rather than sloping away from the player. The ball is fired to the top and falls back down through pins, gates and pockets under gravity, so where it finishes owes more to the pin field than to anything the player does after the shot.

        ## The orientation, not the cabinet

        Standing the playfield up says nothing about how big the machine is or where it sits. [[manufacturer:gottlieb]]'s *[[title:chuck-o-luck]]* (1932) is 14 inches tall and lives on a bar — small enough to be left out of some reference works, since "it's small and vertical, resembling a pachinko game more than a traditional pinball machine"[[cite:1]] — while [[manufacturer:williams]] put the same idea on a full-sized floor machine with *[[title:still-crazy]]* half a century later. [[manufacturer:american-amusement-company]] sold both at once: *[[title:bat-a-ball]]* is "a floor-standing upright game", and *[[title:junior-league-bat-a-ball]]* is its counter version,[[cite:2]] the playfield vertical in each. The orientation and the [[cabinet:upright]] form factor are separate facts about a machine, and either can hold without the other.

        ## Pachinko is the format at scale

        The vertical pin field found its mass audience in [[location:japan]] rather than in the West. A pachinko machine "resembles a vertical pinball machine, but is different from Western pinball in several ways",[[cite:3]] and plays the way these games do: "The balls fall vertically through an array of pins, levers, cups, traps and obstacles until they enter a payoff target or reach the bottom of the playfield".[[cite:4]] Western makers reached the same layout repeatedly and independently, from the coin-operated [[game-format:bagatelle]] of *[[title:pickwick]]* onwards, without ever building an industry on it.

        ## What a flipper can do here

        A ball crossing a vertical surface arrives fast and leaves quickly, which is hard on the flipper. Many of these machines are [[tag:flipperless]] for that reason, and those that answer the problem often answer it with something other than a flipper: [[manufacturer:melchers-automatenbau-kg]]'s *[[title:flik-flak]]* has "No flippers in the traditional sense, but each of the two springs that form the bottom edge of the playfield has a kicker post below it"[[cite:5]] — the player times a kick at a resting ball rather than swinging a bat at a rolling one.
