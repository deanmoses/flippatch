attribution: flipcommons-catalog
description: >
  Galactic Tank Force family details across the American Pinball editions
claims:
  - gameplay-feature.aura-lighting:
      create: true
      name: AURA Lighting
      gameplay_feature_parent: [interactive-lighting]
  - gameplay-feature.lenticular-backglasses:
      create: true
      name: Lenticular Backglasses
      gameplay_feature_alias: [Lenticular Backglass, 3D Backglass]
  - person.jack-haeger:
      create: true
      cite:
        ref: "https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        archive: "https://web.archive.org/web/20231002204904id_/https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        quote: "There to tell them more about the game and the process of creating it were Dennis Nordman (Design), Paul Reno (Design), Jack Haeger (Art Director), Christopher Franchi (Artist), and Steve Bowden (Rules)"
      name: Jack Haeger
  - person.steve-bowden:
      create: true
      cite:
        ref: "https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        archive: "https://web.archive.org/web/20231002204904id_/https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        quote: "There to tell them more about the game and the process of creating it were Dennis Nordman (Design), Paul Reno (Design), Jack Haeger (Art Director), Christopher Franchi (Artist), and Steve Bowden (Rules)"
      name: Steve Bowden
  - person.kerri-hoskins:
      create: true
      cite:
        ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        quote: "the talented cast: (L to R) Kerri Hoskins, Jeff Hoover, Mitchell Pollitt, and Clementine Morfoot"
      name: Kerri Hoskins
  - person.jeff-hoover:
      create: true
      cite:
        ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        quote: "the talented cast: (L to R) Kerri Hoskins, Jeff Hoover, Mitchell Pollitt, and Clementine Morfoot"
      name: Jeff Hoover
  - person.mitchell-pollitt:
      create: true
      note: "American Pinball's own sources split the surname: the cast announcement and Pinball News spell Pollitt, the product page Politt, kept as an alias."
      cite:
        ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        quote: "the talented cast: (L to R) Kerri Hoskins, Jeff Hoover, Mitchell Pollitt, and Clementine Morfoot"
      name: Mitchell Pollitt
      person_alias: [Mitchell Politt]
  - person.clementine-morfoot:
      create: true
      cite:
        ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
        archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
