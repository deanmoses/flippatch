        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: Mitesh Pithva ... ENGINEERING
      name: Mitesh Pithva
  - model.galactic-tank-force-classic:
      note: "The statement covers the game itself rather than one edition, so the value holds for this edition."
      cite:
        ref: "https://americanpinball.com/galactic-tank-force"
        locator: the page's meta description
        quote: "Galactic Tank Force is a sci-fi pinball machine featuring a fun storyline where you must protect the cows and save the ice cream!"
      game_format: pinball
  - model.galactic-tank-force-classic:
      note: "American Pinball's own team announcement. Role mappings: Art Director maps to the art role; Rules maps to the design role (rules design is game design). The team is stated for the game itself, so every edition carries the credits."
      cite:
        ref: "https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        archive: "https://web.archive.org/web/20231002204904id_/https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        quote: "There to tell them more about the game and the process of creating it were Dennis Nordman (Design), Paul Reno (Design), Jack Haeger (Art Director), Christopher Franchi (Artist), and Steve Bowden (Rules)"
      credit:
        - dennis-nordman: design
        - paul-reno: design
        - jack-haeger: art
        - christopher-franchi: art
        - steve-bowden: design
  - model.galactic-tank-force-classic:
      note: "Journalism (Pinball News launch coverage); no first-party statement of the robot voice was found. The voice is in the game every edition shares."
      cite:
        ref: "https://www.pinballnews.com/site/2023/03/22/galactic-tank-force-promo-released"
        quote: game designer Dennis Nordman appears in the game as the voice of the Nord-Man 3000 robot
      credit:
        - dennis-nordman: voice
  - model.galactic-tank-force-classic:
      note: "The four actors perform the game's live-action display characters (Empress Annoya, Professor Plotnik, Duke Moonwalker, Captain Kyan); the credit-role taxonomy has no performer role, so the role is recorded as other (user ruling 2026-08-10). The display cast is in the game every edition shares. AP's own sources split the surname spelling; Pollitt follows AP's cast announcement (user ruling 2026-08-10), with Politt kept as an alias."
      cite:
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/"
          archive: "https://web.archive.org/web/20230606065409id_/https://www.american-pinball.com/games/galactic-tank-force"
          quote: "groundbreaking live-action performances from four talented actors: Kerri Hoskins, Jeff Hoover, Mitchell Politt, and Clementine Morfoot"
        - ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
          archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
          quote: "the talented cast: (L to R) Kerri Hoskins, Jeff Hoover, Mitchell Pollitt, and Clementine Morfoot"
      credit:
        - kerri-hoskins: other
        - jeff-hoover: other
        - mitchell-pollitt: other
        - clementine-morfoot: other
  - model.galactic-tank-force-classic:
      note: "The interactive tank sculpt is the game's central toy on every edition, and American Pinball's Victory upgrade copy states the standard sculpt's signature motorized action - a toy that moves under motor power during gameplay, which is what the animatronic toy classification records (the same classification as Stern's motorized animatronic Megatron). Its bespoke identity (Model 375A battle tank) stays in the family doc's future-unique-features list."
      cite:
        ref: "https://americanpinball.com/galactic-tank-force-victory-edition"
        quote: It retains the signature motorized action while adding 3 embedded interactive LEDs that react during game modes and attacks.
      gameplay_feature: [animatronic-toys]
  - model.galactic-tank-force-classic:
      note: "The core playfield is shared by every edition. The maker's own playfield-callout flyer names both mechanisms; Pinball News' launch photo caption corroborates the player-operated diverter."
      cite:
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          quote: Controlled Diverter Use the third flipper button to divert ramp shots.
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          quote: "UFO Moving Target Stop cows from being abducted!"
        - ref: "https://www.pinballnews.com/site/2023/03/22/galactic-tank-force-promo-released"
          locator: photo caption in the playfield section
          quote: The player-operated ball diverter
      gameplay_feature: [diverters, moving-targets]
  - model.galactic-tank-force-classic:
      note: "The flyer's playfield photo shows the machine's printed credits panel, transcribed by hand into the evidence cache. Role mappings: GAME CODE maps to software; 2D+VIDEO ART to the animation role; DIRECTOR OF MECH. ENGINEERING and ENGINEERING to mechanics; AUDIO ENGINEER to sound. Steve Bowden thus carries both design (Rules, per the team announcement) and software (GAME CODE). The panel's remaining line, David Fix ... EXECUTIVE VICE PRESIDENT, is a corporate title with no credit role and is recorded in the family doc. The credits are printed on the game every edition shares."
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: "Dennis Nordman & Paul Reno ... GAME DESIGN [...] Zofia Bil Ryan ... DIRECTOR OF MECH. ENGINEERING [...] Jessica Durbala & Bobby Llereza ... 2D+VIDEO ART [...] Joe Schober, Casey Butler & Steve Bowden ... GAME CODE [...] Mitesh Pithva ... ENGINEERING [...] Matt Kern ... AUDIO ENGINEER"
      credit:
        - joe-schober: software
        - casey-butler: software
        - steve-bowden: software
        - jessica-durbala: animation
        - bobby-llereza: animation
        - zofia-bil-ryan: mechanics
        - mitesh-pithva: mechanics
        - matt-kern: sound
  - model.galactic-tank-force-classic:
      note: "The manual's rules chapter documents the game every edition shares. Supersedes an earlier ingest's uncounted skill shot and multiball attachments (user-approved 2026-08-10). The skill shot section teases further undocumented skill shots ('There are more skill shots. Can you find them all?'); the count follows the maker's own heading."
      cite:
        ref: "https://48804760.fs1.hubspotusercontent-na1.net/hubfs/48804760/Support%20Files/Game%20Manuals/Galactic%20Tank%20Force%20-%20Game%20Manual.pdf"
        locator: "printed page 44, PDF document page 54"
        quote: "SKILL SHOTS (2) [...] MULTIBALL MODES (3)"
      gameplay_feature: [{ skill-shot: 2 }, { multiball: 3 }]
