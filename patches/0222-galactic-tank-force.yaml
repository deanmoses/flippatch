      note: "The manual's rules chapter documents the game every edition shares. The skill shot section teases further undocumented skill shots ('There are more skill shots. Can you find them all?'); the count follows the manufacturer's own heading."
      cite:
        ref: "https://48804760.fs1.hubspotusercontent-na1.net/hubfs/48804760/Support%20Files/Game%20Manuals/Galactic%20Tank%20Force%20-%20Game%20Manual.pdf"
        locator: "printed page 44, PDF document page 54"
        quote: "SKILL SHOTS (2) [...] MULTIBALL MODES (3)"
      gameplay_feature: [{ skill-shot: 2 }, { multiball: 3 }]
