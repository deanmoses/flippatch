      create: true
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: "Joe Schober, Casey Butler & Steve Bowden ... GAME CODE"
      name: Casey Butler
  - person.jessica-durbala:
      create: true
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: "Jessica Durbala & Bobby Llereza ... 2D+VIDEO ART"
      name: Jessica Durbala
  - person.bobby-llereza:
      create: true
      note: "The panel's cursive print is small; coverage of American Pinball's animation team corroborates the surname reading."
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: "Jessica Durbala & Bobby Llereza ... 2D+VIDEO ART"
      name: Bobby Llereza
  - person.zofia-bil-ryan:
      create: true
      note: "Zofia per the machine's printed credits and Pinball News' launch coverage; the Sofia spelling appears in Pinball News' Expo 2023 report and is kept as an alias."
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: Zofia Bil Ryan ... DIRECTOR OF MECH. ENGINEERING
      name: Zofia Bil Ryan
      person_alias: [Sofia Bil Ryan]
  - person.mitesh-pithva:
      create: true
      note: "The panel's cursive print is small; staff listings of American Pinball's engineering team corroborate the name reading."
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
        quote: Mitesh Pithva ... ENGINEERING
      name: Mitesh Pithva
  - model.galactic-tank-force-classic:
      note: "The statement covers the game, so it holds for every edition."
      cite:
        ref: "https://americanpinball.com/galactic-tank-force"
        locator: the page's meta description
        quote: "Galactic Tank Force is a sci-fi pinball machine featuring a fun storyline where you must protect the cows and save the ice cream!"
      game_format: pinball
  - model.galactic-tank-force-classic:
      note: "The team is stated for the game, so every edition carries the credits."
      cite:
        ref: "https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        archive: "https://web.archive.org/web/20231002204904id_/https://www.american-pinball.com/news/slam-tilt-podcast-interviews-the-galactic-tank-fo"
        quote: "There to tell them more about the game and the process of creating it were Dennis Nordman (Design), Paul Reno (Design), Jack Haeger (Art Director), Christopher Franchi (Artist), and Steve Bowden (Rules)"
      credit:
        - dennis-nordman: design
        - paul-reno: design
        - jack-haeger: art
        - christopher-franchi: art
        - steve-bowden: design
  - model.galactic-tank-force-classic:
      note: "The voice is in the game every edition shares."
      cite:
        ref: "https://www.pinballnews.com/site/2023/03/22/galactic-tank-force-promo-released"
        quote: game designer Dennis Nordman appears in the game as the voice of the Nord-Man 3000 robot
      credit:
        - dennis-nordman: voice
  - model.galactic-tank-force-classic:
      note: "The four actors perform the game's live-action display characters (Empress Annoya, Professor Plotnik, Duke Moonwalker, Captain Kyan); the credit roles have no performer role, so they record as other. The cast is in the game every edition shares. American Pinball's own sources split the surname: Pollitt follows its cast announcement, with Politt kept as an alias."
      cite:
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/"
          archive: "https://web.archive.org/web/20230606065409id_/https://www.american-pinball.com/games/galactic-tank-force"
          quote: "groundbreaking live-action performances from four talented actors: Kerri Hoskins, Jeff Hoover, Mitchell Politt, and Clementine Morfoot"
        - ref: "https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
          archive: "https://web.archive.org/web/20231129091706id_/https://www.american-pinball.com/news/american-pinball-inc-with-the-stars-of-galactic-t"
          quote: "the talented cast: (L to R) Kerri Hoskins, Jeff Hoover, Mitchell Pollitt, and Clementine Morfoot"
      credit:
        - kerri-hoskins: other
        - jeff-hoover: other
        - mitchell-pollitt: other
        - clementine-morfoot: other
  - model.galactic-tank-force-classic:
      note: "The tank sculpt moves under motor power during play, so it is an animatronic toy."
      cite:
        ref: "https://americanpinball.com/galactic-tank-force-victory-edition"
        quote: It retains the signature motorized action while adding 3 embedded interactive LEDs that react during game modes and attacks.
      gameplay_feature: [animatronic-toys]
  - model.galactic-tank-force-classic:
      note: "The core playfield is shared by every edition."
      cite:
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          quote: Controlled Diverter Use the third flipper button to divert ramp shots.
        - ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
          quote: "UFO Moving Target Stop cows from being abducted!"
        - ref: "https://www.pinballnews.com/site/2023/03/22/galactic-tank-force-promo-released"
          locator: photo caption in the playfield section
          quote: The player-operated ball diverter
      gameplay_feature: [diverters, moving-targets]
  - model.galactic-tank-force-classic:
      note: "The credits are printed on the game every edition shares."
      cite:
        ref: "https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        archive: "https://web.archive.org/web/20250920035317id_/https://www.american-pinball.com/games/galactic-tank-force/img/GTK_M13_Flyer.jpg"
        locator: the CREDITS panel printed beside the shooter lane in the playfield photo
