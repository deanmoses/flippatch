        locator: in the Frequently Asked Questions section
        quote: "There are three pinball machines for Sonic: the Collector's Edition ($15,000), the Special Edition ($12,000), and the Arcade Edition ($9,999)."
      variant_of: sonic-the-hedgehog-special-edition
  - model.sonic-the-hedgehog-collectors-edition:
      note: "Classifications: the Mechanical Battle Topper attaches as a topper; Gold Wireform Ramps attach as habitrails (wireform); the Gold Ring Shooter Knob is a custom shooter knob; the External LED Lighting Package reacts to gameplay per the collection page's cabinet caption, so it attaches as interactive cabinet lighting; the Guarnieri & Ritchie Signature Card attaches as designer autographs."
      cite:
        - ref: "https://jerseyjackpinball.com/products/sonic-collectors-edition"
          quote: "Sonic Vs. Dr. Eggman Mechanical Battle Topper with Super-Wide LCD Screen [...] 'Knuckles Red' Metallic Laser-Cut Armor [...] Gold Wireform Ramps [...] Gold Ring Shooter Knob [...] External LED Lighting Package [...] Shaker Motor with Haptic Feedback [...] Industry Leading JJP Invisiglass™ [...] 'Collector's Edition' Numbered Plaque [...] 'Jersey Jack' Guarnieri & Steve Ritchie Signature Card"
        - ref: "https://jerseyjackpinball.com/collections/sonic-the-hedgehog-pinball-game"
          locator: in The Cabinet section
          quote: "external lighting surrounds the cabinet in a bold, reactive glow"
